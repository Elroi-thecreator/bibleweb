# =====================================================================
# Nginx Configuration for Holy Bible Web App at Root (/)
# Place inside /etc/nginx/sites-available/default or include as snippet
# =====================================================================

# 1. Backward-compatible 301 redirection from legacy /bible subpath to root
location ~ ^/bible/?(.*)$ {
    return 301 /$1;
}

# 2. Main Holy Bible FastAPI Application Proxy
location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;

    # WebSocket and EventSource / Chunked Streaming Support (Edge-TTS & Ask Bible AI)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Standard Proxy Headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Performance & Streaming Buffering Settings
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_connect_timeout 75s;
    proxy_send_timeout 300s;

    # Client payload size (for audio / verse import if needed)
    client_max_body_size 25M;
}
