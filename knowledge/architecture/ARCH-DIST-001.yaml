id: ARCH-DIST-001
type: architecture_standard
title: PyInstaller Standalone Windows Executable & WinGet Distribution Pipeline
domain: architecture
status: approved
version: 1.2.0
authority:
  level: official
  confidence: high
owner:
  team: devops_team

applies_to:
  - windows_app
  - ci_cd
  - distribution

rule:
  "The Windows desktop application is packaged as a single portable self-contained executable (`HolyBible-Portable.exe`) via PyInstaller and distributed automatically to GitHub Releases and Microsoft WinGet Package Manager (`ElroiTheCreator.HolyBible`) with full compliance for WinGet Policy 1.5.1 (`PrivacyUrl` pointing to `PRIVACY.md`) and Policy 2.2 (open-licensed/Public Domain scripture corpora documented in `LICENSE` and `NOTICE.md`)."

do:
  - "Bundle `data/bible.sqlite.db`, `data/songs.sqlite.db`, `templates/`, `static/`, `LICENSE`, `NOTICE.md`, and `PRIVACY.md` as internal datas via `windows_app/holybible.spec`."
  - "Include `pywebview`, `uvicorn`, `fastapi`, and all third-party dependencies inside the one-file binary bundle."
  - "Handle `--noconsole` mode safely by wrapping `sys.stdout` and `sys.stderr` with a dummy `SafeStream` and setting `log_config=None` in `uvicorn.Config` to prevent `AttributeError: 'NoneType' object has no attribute 'isatty'`."
  - "Automate compilation, SHA256 checksum generation, GitHub release creation, and WinGet manifest updates via `.github/workflows/release_windows.yml` on `v*` tag pushes utilizing native Komac CLI automation."
  - "Conform to Microsoft WinGet portable installer schema constraints (single command alias `- holybible`, `PrivacyUrl: https://github.com/Elroi-thecreator/bibleweb/blob/main/PRIVACY.md`, `License: MIT AND CC-BY-SA-4.0`, and `CopyrightUrl: https://github.com/Elroi-thecreator/bibleweb/blob/main/NOTICE.md`)."

dont:
  - "Do not commit compiled `.exe` or build artifacts (`windows_app/dist/`, `windows_app/build/`) to git."
  - "Do not leave active console windows open in production desktop releases (`console=False` in spec)."
  - "Do not submit mismatched SHA256 hashes or unreachable download URLs in WinGet manifests."
  - "Do not bundle third-party scripture text without verifiable redistribution rights and attribution notices."

reason:
  "Provides end users with a frictionless zero-install experience on Windows while leveraging official Microsoft WinGet repository discovery and adhering to WinGet policies 1.5.1 and 2.2."

related_items:
  - ARCH-SYS-001
  - DEV-BUILD-001
  - ADR-003
