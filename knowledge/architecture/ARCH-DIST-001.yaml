id: ARCH-DIST-001
type: architecture_standard
title: PyInstaller Standalone Windows Executable & WinGet Distribution Pipeline
domain: architecture
status: approved
version: 1.0.0
authority:
  level: official
  confidence: high
owner:
  team: devops_team

applies_to:
  - windows_app
  - ci_cd
  - distribution

rule:
  "The Windows desktop application is packaged as a single portable self-contained executable (`HolyBible-Portable.exe`) via PyInstaller and distributed automatically to GitHub Releases and Microsoft WinGet Package Manager (`ElroiTheCreator.HolyBible`)."

do:
  - "Bundle `bible_verses.db`, `templates/`, and `static/` directories as internal datas via `windows_app/holybible.spec`."
  - "Include `pywebview`, `uvicorn`, `fastapi`, and all third-party dependencies inside the one-file binary bundle."
  - "Handle `--noconsole` mode safely by wrapping `sys.stdout` and `sys.stderr` with a dummy `SafeStream` and setting `log_config=None` in `uvicorn.Config` to prevent `AttributeError: 'NoneType' object has no attribute 'isatty'`."
  - "Automate compilation, SHA256 checksum generation, GitHub release creation, and WinGet manifest updates via `.github/workflows/release_windows.yml` on `v*` tag pushes."
  - "Conform to Microsoft WinGet portable installer schema constraints (single command alias `- holybible`)."

dont:
  - "Do not commit compiled `.exe` or build artifacts (`windows_app/dist/`, `windows_app/build/`) to git."
  - "Do not leave active console windows open in production desktop releases (`console=False` in spec)."
  - "Do not submit mismatched SHA256 hashes or unreachable download URLs in WinGet manifests."

reason:
  "Provides end users with a frictionless zero-install experience on Windows while leveraging official Microsoft WinGet repository discovery."

related_items:
  - ARCH-SYS-001
  - DEV-BUILD-001
  - ADR-003
