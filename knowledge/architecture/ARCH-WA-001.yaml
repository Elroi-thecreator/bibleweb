id: ARCH-WA-001
type: architecture_standard
title: Decoupled WhatsApp Gateway & Reusable Bot Engine Architecture
domain: architecture
status: approved
version: 1.9.0
authority:
  level: official
  confidence: high
owner:
  team: core_architecture

applies_to:
  - backend
  - whatsapp_gateway
  - routes
  - render
  - supabase

rule:
  "The WhatsApp gateway integration uses an isolated 5-layer decoupled architecture based on WA-AKG (Next.js + Baileys). Core gateway communication, conversational session storage, and command dispatching in `whatsapp_gateway/client/` and `whatsapp_gateway/bot/` maintain zero dependencies on application databases or schemas, isolating all domain behaviors into `whatsapp_gateway/adapters/` and exposing a mountable FastAPI router in `whatsapp_gateway/routes/`. On cloud platforms (Render.com), the application orchestrates the `elroi-bible` Python web service and the `wa-akg-gateway` Node.js service, while delegating persistent multi-device WhatsApp authentication and session storage to an external Supabase PostgreSQL database (`DATABASE_URL`), eliminating Render's 30-day database expiration and preserving Render resource quotas."

do:
  - "Keep Layer 1 (`whatsapp_gateway/client/`) and Layer 2 (`whatsapp_gateway/bot/`) strictly domain-agnostic so the package can be dropped into any other FastAPI or Python project without modification."
  - "Isolate application-specific interactions (scripture queries, hymn retrieval, quiz evaluation, and audio clips) strictly within Layer 3 (`whatsapp_gateway/adapters/`)."
  - "Wrap all blocking SQLite queries in `await asyncio.to_thread(...)` within adapter handlers as mandated by DEV-PY-001."
  - "Support multi-turn conversations (such as interactive quizzes) via an in-memory session store with automatic TTL expiration."
  - "Provide a simulation mode in `WAClient` (`simulation_mode=True`) enabling automated end-to-end verification without live WhatsApp hardware."
  - "Mount the controller into `app/main.py` using standard FastAPI router patterns: `app.include_router(whatsapp_router, prefix='/api/whatsapp')`."
  - "Orchestrate `elroi-bible` and `wa-akg-gateway` in `render.yaml` utilizing Render's `repo: https://github.com/mrifqidaffaaditya/WA-AKG.git` and connecting to external Supabase PostgreSQL via `DATABASE_URL` (`sync: false`)."
  - "In `render.yaml`, adapt WA-AKG's Prisma datasource provider during build (`sed -i 's/\"mysql\"/\"postgresql\"/g' prisma/schema.prisma`) to seamlessly bind with Supabase PostgreSQL."

dont:
  - "Do not import `app.db`, `app.quiz_data`, or `app.plans_data` inside `whatsapp_gateway/client/` or `whatsapp_gateway/bot/`."
  - "Do not block the main asyncio event loop with synchronous audio synthesis or database reads."
  - "Do not process webhook messages where `payload.is_from_me()` is True, preventing recursive bot message loops."
  - "Do not declare unnecessary auxiliary services or databases in `render.yaml` that trigger quota limits on Render workspaces."

reason:
  "Strict layer separation ensures full reusability across future software projects, keeps the codebase maintainable, and guarantees that external messaging failures cannot destabilize core desktop or web scripture reading services. Single-service deployment prevents quota exhaustion on Render."

related_items:
  - ARCH-SYS-001
  - ARCH-DATA-001
  - DEV-PY-001
