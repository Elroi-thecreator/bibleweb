id: ARCH-WA-001
type: architecture_standard
title: Decoupled WhatsApp Gateway & Reusable Bot Engine Architecture
domain: architecture
status: approved
version: 1.19.0
authority:
  level: official
  confidence: high
owner:
  team: core_architecture

applies_to:
  - backend
  - whatsapp_gateway
  - routes
  - render
  - supabase
  - storage
  - audio_player
  - scheduler
  - sync
  - card_generator

rule:
  "The WhatsApp gateway integration uses an isolated 5-layer decoupled architecture based on WA-AKG (Next.js + Baileys). Core gateway communication, conversational session storage, and command dispatching in `whatsapp_gateway/client/` and `whatsapp_gateway/bot/` maintain zero dependencies on application databases or schemas, isolating all domain behaviors into `whatsapp_gateway/adapters/` and exposing a mountable FastAPI router in `whatsapp_gateway/routes/`. On cloud platforms (Render.com), the application orchestrates the `elroi-bible` Python web service and the `wa-akg-gateway` Node.js service, while delegating persistent multi-device WhatsApp authentication and session storage to an external Supabase PostgreSQL database (`DATABASE_URL`), eliminating Render's 30-day database expiration and preserving Render resource quotas. Python-side subscriber state uses dual-persistence with thread-safe SQLite (`data/whatsapp_subscribers.sqlite.db`) and automatic JSON backup hydration (`data/whatsapp_subscribers.json`) to guarantee zero-loss recovery across ephemeral dyno/container restarts. Subscribers feature configurable reminder dispatch times (defaulting strictly to morning 5:00 AM / '05:00'), isolated reading plan start tracking (`plan_start_date`), active reading plan selection (Full Bible in 365 Days, New Testament in 90 Days, Proverbs in 31 Days, Psalms of Comfort, and Deuterocanonical Books), reading habit streak tracking (`streak_count`, `last_read_date`, `completed_days`), shareable 1080x1080 status image card generation, bilingual parallel scripture delivery (`lang both`), and zero-password 15-minute magic linking synchronization (`/sync`) between WhatsApp and the Web Bible app. Incoming traffic is governed by a thread-safe sliding-window rate limiter and quota controller (`WhatsAppRateLimiter` in `whatsapp_gateway/rate_limiter.py`), throttling rapid bursts (configurable `requests_per_minute`, default 20), enforcing daily audio synthesis quotas (`daily_audio_limit`, default 15) to shield Edge-TTS and FFmpeg, delivering automatic bilingual cooldown notices in Tamil and English, and permitting unrestricted bypass for whitelisted phone numbers."

do:
  - "Keep Layer 1 (`whatsapp_gateway/client/`) and Layer 2 (`whatsapp_gateway/bot/`) strictly domain-agnostic so the package can be dropped into any other FastAPI or Python project without modification."
  - "Isolate application-specific interactions (scripture queries, hymn retrieval, quiz evaluation, audio clips, image cards, streaks, and sync) strictly within Layer 3 (`whatsapp_gateway/adapters/`)."
  - "Wrap all blocking SQLite queries in `await asyncio.to_thread(...)` within adapter handlers and subscriber managers as mandated by DEV-PY-001."
  - "Support multi-turn conversations (such as interactive quizzes) via an in-memory session store with automatic TTL expiration."
  - "Provide a simulation mode in `WAClient` (`simulation_mode=True`) enabling automated end-to-end verification without live WhatsApp hardware."
  - "Format outgoing text messages for WA-AKG Baileys engine with native payload structures `{'message': {'text': text}}` at `/messages/{sessionId}/{jid}/send`, falling back gracefully to `/messages/send-text`."
  - "Dispatch voice notes and media to WA-AKG via `POST /api/messages/{sessionId}/{encodedJid}/media` using `multipart/form-data` with `file`, `type` ('voice' for push-to-talk waveforms or 'audio' for standard playback), and optional `caption`."
  - "Transcode Edge-TTS / gTTS synthesized MP3 audio into WhatsApp-compliant ISO MP4 containers (AAC-LC audio, `.m4a`, `audio/mp4`) with `+faststart` atom via `whatsapp_gateway/audio_converter.py` using bundled `imageio-ffmpeg` or system FFmpeg before dispatching to WA-AKG, preventing ExoPlayer `UnrecognizedInputFormatException` on mobile devices caused by WA-AKG's hardcoded `mimetype: audio/mp4`."
  - "If FFmpeg transcoding is unavailable or fails, automatically fallback to dispatching the MP3 payload with `type: document` and `mimetype: audio/mpeg` so WA-AKG preserves native MP3 MIME types without triggering mobile decoder crashes."
  - "Avoid setting static `Content-Type: application/json` on the underlying `httpx.AsyncClient` session to permit `httpx` to dynamically calculate multipart boundaries for file uploads."
  - "Parse audio commands using robust regex patterns matching single chapters (`audio John 1`), numbered books (`audio 1 John 1`), verse ranges (`audio John 1:1-5`), and Tamil scripture requests (`audio யோவான் 1`, `கேட்க யோவான் 1`)."
  - "Synthesize audio voice notes using Microsoft Edge Neural TTS (`en-US-ChristopherNeural` for English, `ta-LK-KumarNeural` for Tamil) with deep bass modulation (`pitch='-8Hz'`), stripping editorial brackets/braces, with automatic `gTTS` fallback."
  - "Provide automated graceful text fallback with chapter scripture text if media delivery fails or encounters upstream gateway errors, ensuring users never experience dead-silence."
  - "Include `x-api-key` and `Authorization: Bearer <key>` headers in `WAClient` requests when an API key is configured."
  - "Parse incoming webhooks via `IncomingWebhookPayload` supporting both simplified REST wrapper fields (`sender`, `from`, `body`, `text`, `caption`, `content`) and raw Baileys multi-device schemas (`conversation`, `extendedTextMessage.text`, `buttonsResponseMessage`, `listResponseMessage`)."
  - "Normalize gateway session status responses in `WAClient.get_session_status()` to standardized top-level statuses (`CONNECTED`, `DISCONNECTED`, `INITIALIZING`, `UNKNOWN`, `UNREACHABLE`) for frontend UI consumers."
  - "Implement dual-storage subscriber persistence: store active subscriptions in SQLite (`data/whatsapp_subscribers.sqlite.db`) and mirror active records to `data/whatsapp_subscribers.json` on every change; auto-hydrate the SQLite database from JSON upon cold container startup."
  - "Support an optional, pluggable asynchronous task queue layer powered by RabbitMQ (`whatsapp_gateway/queue/` via `aio-pika`), providing durable task queuing for incoming webhook ingestion (`whatsapp_incoming_messages`) and outgoing broadcasts (`whatsapp_outgoing_messages`) with automatic, transparent fallback to direct in-memory execution when RabbitMQ is disabled or the broker is unreachable."
  - "Automatically buffer all outbound requests from the web bible to the WA-AKG gateway (`https://wa-akg-gateway-ub6a.onrender.com/`) as durable RabbitMQ messages when queue mode is active. The consumer actively verifies whether the gateway is running (`client.is_gateway_running()`), holding tasks and polling with lightweight wake-up pings during Render cold starts until the gateway is active before dispatching."
  - "Automatically auto-reply to greetings ('Hi', 'Hello', 'Hey', 'வணக்கம்') with a structured bilingual menu showcasing all 7 available bot options (Scripture Reading, Audio Bible, Scripture Search, Daily Bible Quiz, Devotional Subscription, Hymns, and Reading Plans), with direct 1-7 numeric selection routing."
  - "Immediately dispatch a progress notice ('⏳ *Processing your audio request...*' / '⏳ *உங்கள் ஆடியோ பதிவு தயாராகிறது...*') upon validating an audio request before initiating Edge-TTS synthesis and FFmpeg transcoding, providing instant visual feedback so users know their audio is being prepared."
  - "Provide complete whole-Bible reading plans in WhatsApp (`plan`, `plan full`, `plan nt`, `plan proverbs`, `plan psalms`, `plan deuterocanon`), featuring a full 365-day canonical Bible reading track covering all 1,189 chapters (~3.2 ch/day) with instant plan switching, individualized start tracking (`plan_start_date` starting at Day 1), and specific day lookups (`plan 50`)."
  - "Track daily reading habit streaks (`done`, `streak`, `progress`, `முடித்தேன்`), automatically calculating consecutive day milestones, managing `streak_count`, `last_read_date`, and JSON-encoded `completed_days` in subscriber records, and rendering visual text progress bars (`[▓▓▓░░░░░░░] 30%`)."
  - "Generate aesthetic, high-resolution 1080x1080 graphic status cards (`card`, `image`, `status`, `படம்`) via Pillow (`whatsapp_gateway/adapters/card_generator.py`) with radial midnight gradients, dual gold borders, citation banners, and dual-language typography (Nirmala UI / Georgia / Arial) formatted for WhatsApp Status sharing."
  - "Support bilingual parallel scripture mode (`lang both`, `parallel`, `lang en`, `lang ta`), presenting side-by-side Tamil and English verses for scripture citations and daily devotional dispatches."
  - "Provide zero-password magic linking synchronization between WhatsApp and the Web Bible app (`sync`, `link`, `/sync`) using ephemeral 15-minute codes (`whatsapp_gateway/sync_store.py`) and REST endpoints (`/api/whatsapp/sync/verify`, `/api/whatsapp/sync/push-progress`, `/api/whatsapp/sync/request-code`)."
  - "Store subscriber reminder times in the `reminder_time TEXT DEFAULT '05:00'` column with automatic migration, defaulting morning 5:00 AM ('05:00') for all daily devotional and verse reminders."
  - "Expose multi-format reminder configuration commands (`remind 5 AM`, `remind 6:30 AM`, `remind 18:30`, `remind off`, `நேரம் காலை 5`) with intelligent 12-hour/24-hour parsing in `parse_reminder_time` and 12-hour friendly confirmation formatting."
  - "Run a non-blocking background scheduler (`DevotionalScheduler` in `whatsapp_gateway/scheduler/runner.py`) integrated into FastAPI lifespan, evaluating target-time subscribers and broadcasting assigned reading checkpoints without thread saturation."
  - "Protect bot availability and upstream resources with `WhatsAppRateLimiter` sliding-window evaluation across a 60-second window per normalized sender JID/phone, throttling excessive message rates with bilingual cooldown messages ('⏳ *Too Many Requests!*' / '⏳ *அதிக கோரிக்கைகள்*')."
  - "Enforce a distinct daily audio synthesis quota per user (`daily_audio_limit`, default 15) before initiating Edge-TTS neural speech synthesis and FFmpeg transcoding, gracefully declining requests with bilingual reset notices while allowing text scripture reading to continue unhindered."
  - "Permit designated administrator phone numbers (`rate_limit_whitelist`) to bypass both sliding-window rate limits and daily audio quotas, with robust normalization handling spaces, country codes (`+91`), and WhatsApp JID domain suffixes (`@s.whatsapp.net`)."
  - "Expose real-time rate limiter diagnostics and controls via `/api/whatsapp/rate-limiter/status`, `/api/whatsapp/rate-limiter/config`, and `/api/whatsapp/rate-limiter/reset`, backing thresholds in `data/whatsapp_config.json`."
  - "Support dynamic runtime gateway reconfiguration via `data/whatsapp_config.json` and `wa_client.update_config(...)` to hot-swap endpoint URLs, session IDs, rate limiter thresholds, and simulation modes with zero downtime."
  - "Provide an interactive CLI message dispatcher and diagnostic tool (`scripts/send_whatsapp_message.py`) with `--audio` support for live session verification, manual alert dispatch, and terminal testing."
  - "Mount the controller into `app/main.py` using standard FastAPI router patterns: `app.include_router(whatsapp_router, prefix='/api/whatsapp')`."
  - "Orchestrate `elroi-bible` and `wa-akg-gateway` in `render.yaml` utilizing Render's `repo: https://github.com/mrifqidaffaaditya/WA-AKG.git` and connecting to external Supabase PostgreSQL via `DATABASE_URL` (`sync: false`)."
  - "In `render.yaml`, adapt WA-AKG's Prisma datasource provider during build (`sed -i 's/\"mysql\"/\"postgresql\"/g' prisma/schema.prisma`) to seamlessly bind with Supabase PostgreSQL."

dont:
  - "Do not dispatch raw MP3 bytes under `type: audio` or `type: voice` to WA-AKG without transcoding to an ISO MP4 container (`.m4a`), because WA-AKG forces `mimetype: audio/mp4` which triggers 'audio not available' demuxer errors on mobile WhatsApp."
  - "Do not post JSON payloads to non-existent endpoints like `/messages/send-media`; WA-AKG expects multipart/form-data at `/messages/{sessionId}/{jid}/media`."
  - "Do not lock the `httpx.AsyncClient` default headers to `application/json` which corrupts multipart boundaries."
  - "Do not use simplistic `.split(maxsplit=2)` string parsing for audio references, which fails on numbered books like 1 John or verse ranges."
  - "Do not fail silently when audio dispatch encounters network issues; always reply with fallback scripture text."
  - "Do not block text reading requests when a user exhausts their daily audio voice note quota; audio quotas must only guard heavy speech synthesis pipelines."
  - "Do not evaluate rate limits before verifying sender whitelists; whitelisted numbers must bypass timestamp recording entirely."
  - "Do not import `app.db`, `app.quiz_data`, or `app.plans_data` inside `whatsapp_gateway/client/` or `whatsapp_gateway/bot/`."
  - "Do not block the main asyncio event loop with synchronous audio synthesis, image card generation, or database reads."
  - "Do not process webhook messages where `payload.is_from_me()` is True, preventing recursive bot message loops."
  - "Do not rely exclusively on ephemeral container filesystems for subscriber records without JSON backup synchronization."
  - "Do not declare unnecessary auxiliary services or databases in `render.yaml` that trigger quota limits on Render workspaces."
  - "Do not hardcode gateway session IDs or API keys in code; load from environment variables with admin runtime overrides."

reason:
  "Strict layer separation ensures full reusability across future software projects, keeps the codebase maintainable, and guarantees that external messaging failures cannot destabilize core desktop or web scripture reading services. Offloading multi-device session auth to Supabase prevents 30-day database teardown, while JSON hydration shields subscriber subscriptions against ephemeral dyno cycling. Proper multipart media routing guarantees seamless delivery of devotional voice notes to mobile WhatsApp users. Sliding-window rate limiting and daily audio quotas protect backend infrastructure and neural TTS quotas against denial-of-service and runaway spam loops."

