id: ARCH-ADMIN-001
type: architecture_standard
title: Administrator Authentication, Protected Settings & System Telemetry Architecture
domain: architecture
status: approved
version: 1.9.1
authority:
  level: official
  confidence: high
owner:
  team: security_architecture

applies_to:
  - backend
  - admin
  - security
  - routes
  - templates
  - ask_bible_ai
  - quiz

rule:
  "The Holy Bible system enforces strict role-based access control on `/admin/settings`, `/settings`, all administrative management APIs (`/admin/api/*`), administrative WhatsApp endpoints (`/api/whatsapp/*`), and administrative Ask Bible AI endpoints (`/admin/api/ai/*`). Non-authenticated requests are immediately blocked with HTTP 401 (for JSON API requests) or redirected via HTTP 303 to `/admin/login` (for browser requests). Administrative sessions must use tamper-proof HMAC-SHA256 signed session tokens stored in HttpOnly, SameSite=Lax cookies, with constant-time password comparisons. Administrators can dynamically update, test, and persist runtime settings—including WhatsApp Gateway parameters, Ask Bible AI LLM Provider Settings (Base URL, API Key, Model, Presets, Grounding, and Simulation Mode), and AI in Scripture Quiz parameters (`quiz_ai_enabled`, `quiz_ai_default_count`, `quiz_ai_difficulty`)—via `POST /admin/api/*` backed by a two-tier persistence architecture: (1) client-side browser Local Memory (`localStorage`) with auto-save, 1-click restore banner, and JSON export/import, and (2) dual-layer server storage writing to project `data/` and mirroring to machine-level `%LOCALAPPDATA%/HolyBible/config` (or `~/.holybible/config`) so configurations never disappear across PyInstaller executable builds or container redeploys."

do:
  - "Mount all administrative routes under `/admin` with route-level security guards (`require_admin`)."
  - "Implement dual-layer server persistence for configurations: save to project `data/` and mirror to persistent OS user storage `%LOCALAPPDATA%/HolyBible/config` (or `~/.holybible/config`) so settings survive PyInstaller `--clean` builds, git cleans, and container rebuilds."
  - "In PyInstaller frozen mode, resolve writable configuration files and chat history databases directly to `%LOCALAPPDATA%/HolyBible/` rather than the ephemeral `sys._MEIPASS` temp directory."
  - "Provide client-side Local Memory (`localStorage`) auto-snapshotting in `templates/admin/settings.html` on form saves, offering 1-click restore, manual save, and JSON export/import."
  - "Display an automatic 1-click restore banner on `/admin/settings` if a fresh build or server reset is detected and previous custom settings exist in browser Local Memory."
  - "Expose protected administrative endpoints `GET /admin/api/settings/export` and `POST /admin/api/settings/import` for atomic backup and restore of system configurations."
  - "Provide dedicated Ask Bible AI & LLM Provider Configuration on `/admin/settings`: display live health status pill, 1-click provider presets (FreeLLMAPI, Groq Cloud, Ollama, OpenAI, Simulation Mode), editable OpenAI-compatible Base URL (`/v1`), masked API key with secure storage, model selector, temperature, max grounding passages, offline simulation mode toggle, and AI in Scripture Quiz controls (`quiz_ai_enabled`, `quiz_ai_default_count`, `quiz_ai_difficulty`)."
  - "Expose protected administrative endpoints `POST /admin/api/ai/config` for runtime AI configuration hot-swapping and `POST /admin/api/ai/test` for live provider reachability probing."
  - "Protect all administrative operations in `whatsapp_gateway/routes/webhook.py` (`toggle-simulation`, `push-devotional`, `broadcast`, `broadcast-all`, `queue/*`, and `rate-limiter/*`) with `require_admin(request)` returning HTTP 401 Unauthorized for unauthenticated callers."
  - "Ensure `require_admin` in `app/admin/auth.py` evaluates both `request.url.path.startswith('/admin/api')` and `request.url.path.startswith('/api/')` as API paths to prevent HTML redirects on JSON endpoints."
  - "Sanitize the public `/whatsapp` page into a user-friendly assistant guide and chat simulator, completely removing simulation toggle buttons, devotional broadcast triggers, subscriber broadcast forms, and internal gateway network endpoints."
  - "Update header navigation links in `/sync` from 'Open WhatsApp Bot Hub' to 'WhatsApp Guide & Chat Simulator'."
  - "Host the live WhatsApp gateway connection status indicator (`gateway-status-pill` and `wa-metric-status-pill`) exclusively within `/admin/settings`, providing administrators with real-time socket connectivity state, simulation mode detection, and automatic telemetry updates via `fetchAdminWaStatus()`, while keeping the public `/whatsapp` page completely free of gateway connection polling."
  - "Redirect public `/settings` to `/admin/settings` to ensure configuration controls are accessible exclusively to authorized administrators."
  - "Provide interactive runtime configuration on `/admin/settings` to view, edit, and persist the active WhatsApp Provider Plugin (`provider`: `meta_cloud_api`, `wa_akg`, or `simulation`), Meta Cloud API credentials, and WA-AKG parameters."
  - "Persist administrative configuration overrides while maintaining backward compatibility with environment variable fallbacks."
  - "Authenticate administrator credentials (`ADMIN_USERNAME`, `ADMIN_PASSWORD`) using `secrets.compare_digest` to eliminate timing attack vulnerabilities."
  - "Sign session tokens with HMAC-SHA256 (`base64(username:timestamp:hmac_signature)`) using `ADMIN_SECRET_KEY` or a cryptographically stable machine seed."
  - "Store admin session tokens in secure `HttpOnly`, `SameSite=Lax` cookies named `bible_admin_session` with a 7-day expiration (604,800s)."
  - "Provide diagnostic telemetry on `/admin/settings`: server uptime, CPU/memory usage via `psutil`, database health for embedded SQLite databases, JSON subscriber backup state, and cache metrics."
  - "Provide instant administrative actions: Purge HTML Cache, Purge Audio TTS Cache, Toggle WhatsApp Simulation Mode, Ping External Gateway, Manually Trigger Daily Devotional Broadcasts, Toggle RabbitMQ Task Queue, and configure Rate Limiter."
  - "Provide clean session termination via `/admin/logout`, properly clearing the session cookie and redirecting to the login portal."
  - "Execute `scripts/test_admin_settings.py` before releasing administrative changes to ensure 100% coverage of auth guards, session cookies, cache purges, runtime configuration persistence, and export/import APIs."

dont:
  - "Do not expose administrative configuration, cache eviction, or broadcast triggers without authentication."
  - "Do not use standard string comparison (`==`) for password validation; always use `secrets.compare_digest`."
  - "Do not store plaintext passwords or unsigned tokens in client cookies or LocalStorage."
  - "Do not return raw 500 error stack traces on failed administrative actions; return structured JSON payloads."

reason:
  "Restricting administrative capabilities and system configuration behind cryptographic HMAC session tokens and timing-safe authentication protects system resources, prevents unauthorized broadcast spamming or cache manipulation, and provides administrators with a centralized control dashboard."

