id: ARCH-ADMIN-001
type: architecture_standard
title: Administrator Authentication, Protected Settings & System Telemetry Architecture
domain: architecture
status: approved
version: 1.12.0
authority:
  level: official
  confidence: high
owner:
  team: security_architecture

applies_to:
  - backend
  - admin
  - security
  - routes
  - templates
  - ask_bible_ai
  - quiz
  - study

rule:
  "The Holy Bible system enforces strict role-based access control on `/admin/settings`, `/settings`, all administrative management APIs (`/admin/api/*`), administrative WhatsApp endpoints (`/api/whatsapp/*`), and administrative Ask Bible AI endpoints (`/admin/api/ai/*`). Non-authenticated requests are immediately blocked with HTTP 401 (for JSON API requests) or redirected via HTTP 303 to `/admin/login` (for browser requests). Administrative sessions must use tamper-proof HMAC-SHA256 signed session tokens stored in HttpOnly, SameSite=Lax cookies, with constant-time password comparisons. Administrators can dynamically update, test, and persist runtime settings—including WhatsApp Gateway parameters, Ask Bible AI LLM Provider Settings (Base URL, API Key, Model, Presets, Grounding, and Simulation Mode), AI in Scripture Quiz parameters (`quiz_ai_enabled`, `quiz_ai_default_count`, `quiz_ai_difficulty`), and AI Scripture Study & Verse Exegesis parameters (`study_ai_enabled`)—via `POST /admin/api/*`, unified `POST /admin/api/settings/save-all`, and on-demand reload `POST /admin/api/settings/reload` backed by a centralized SQLite database (`data/admin_settings.sqlite.db`) as the sole single source of truth. Settings are loaded into active application memory strictly upon app startup/restart, when an administrator saves modifications, or when an administrator explicitly triggers a reload from the database, eliminating all automatic time-to-time background polling, periodic mutations, and test pollution across server reboots, container rebuilds, and PyInstaller executable repackaging."

do:
  - "Mount all administrative routes under `/admin` with route-level security guards (`require_admin`)."
  - "Persist all runtime administrative configuration settings to a dedicated, centralized database: supporting cloud PostgreSQL/Supabase via `DATABASE_URL`/`POSTGRES_URL` or embedded SQLite (`data/admin_settings.sqlite.db`, table `admin_settings`). On serverless platforms (Vercel, AWS Lambda) where `/var/task` is read-only, automatically resolve writable storage to `/tmp/admin_settings.sqlite.db` (hydrated from bundled repository database), and on PyInstaller frozen desktop builds resolve to `%LOCALAPPDATA%/HolyBible/data/admin_settings.sqlite.db` so configurations never disappear across executable builds or container redeploys."
  - "Expose protected administrative endpoint `POST /admin/api/settings/save-all` to atomically persist complete system configurations (AI, WhatsApp, Rate Limiting, and Quotas) directly into the SQLite database in a single transaction."
  - "Expose protected administrative endpoint `POST /admin/api/settings/reload` to allow administrators to re-read and apply all database settings into running memory on demand without restarting the server."
  - "Load all persistent administrative settings from the centralized database into in-memory application singletons (`whatsapp_gateway.config.config`, `whatsapp_gateway.routes.webhook._client`, `ask_bible_ai.config.config`, `ask_bible_ai.service.ai_service`) upon application startup in `lifespan(app)` and immediately upon changes saved by an administrator."
  - "Ensure automated test suites (`scripts/test_admin_settings.py`, `scripts/test_whatsapp_rate_limiter.py`) execute in complete isolation using temporary database paths (`SETTINGS_DATABASE_PATH`), strictly preventing test scripts or background verification from mutating production settings databases or user configuration files."
  - "Expose protected administrative endpoint `GET /admin/api/settings/db-status` for live database connectivity, row count, and size telemetry."
  - "In PyInstaller frozen mode, resolve writable configuration databases and chat history databases directly to `%LOCALAPPDATA%/HolyBible/` rather than the ephemeral `sys._MEIPASS` temp directory."
  - "Expose protected administrative endpoints `GET /admin/api/settings/export` and `POST /admin/api/settings/import` for atomic JSON backup and restore into the centralized SQLite database."
  - "Provide dedicated Ask Bible AI & LLM Provider Configuration on `/admin/settings`: display live health status pill, 1-click provider presets (FreeLLMAPI, Groq Cloud, Ollama, OpenAI, Simulation Mode), editable OpenAI-compatible Base URL (`/v1`), masked API key with secure storage, model selector, temperature, max grounding passages, offline simulation mode toggle, AI in Scripture Quiz controls (`quiz_ai_enabled`, `quiz_ai_default_count`, `quiz_ai_difficulty`), and AI Scripture Study & Verse Exegesis controls (`study_ai_enabled`)."
  - "Expose protected administrative endpoints `POST /admin/api/ai/config` for runtime AI configuration hot-swapping and `POST /admin/api/ai/test` for live provider reachability probing."
  - "Protect all administrative operations in `whatsapp_gateway/routes/webhook.py` (`toggle-simulation`, `push-devotional`, `broadcast`, `broadcast-all`, `queue/*`, and `rate-limiter/*`) with `require_admin(request)` returning HTTP 401 Unauthorized for unauthenticated callers."
  - "Ensure `require_admin` in `app/admin/auth.py` evaluates both `request.url.path.startswith('/admin/api')` and `request.url.path.startswith('/api/')` as API paths to prevent HTML redirects on JSON endpoints."
  - "Sanitize the public `/whatsapp` page into a user-friendly assistant guide and chat simulator, completely removing simulation toggle buttons, devotional broadcast triggers, subscriber broadcast forms, and internal gateway network endpoints."
  - "Update header navigation links in `/sync` from 'Open WhatsApp Bot Hub' to 'WhatsApp Guide & Chat Simulator'."
  - "Host the live WhatsApp gateway connection status indicator (`gateway-status-pill` and `wa-metric-status-pill`) exclusively within `/admin/settings`, providing administrators with real-time socket connectivity state, simulation mode detection, and automatic telemetry updates via `fetchAdminWaStatus()`, while keeping the public `/whatsapp` page completely free of gateway connection polling."
  - "Redirect public `/settings` to `/admin/settings` to ensure configuration controls are accessible exclusively to authorized administrators."
  - "Provide interactive runtime configuration on `/admin/settings` to view, edit, and persist the active WhatsApp Provider Plugin (`provider`: `meta_cloud_api`, `wa_akg`, or `simulation`), Meta Cloud API credentials, and WA-AKG parameters."
  - "Persist administrative configuration overrides to SQLite database while maintaining backward compatibility with environment variable fallbacks."
  - "Authenticate administrator credentials (`ADMIN_USERNAME`, `ADMIN_PASSWORD`) using `secrets.compare_digest` to eliminate timing attack vulnerabilities."
  - "Sign session tokens with HMAC-SHA256 (`base64(username:timestamp:hmac_signature)`) using `ADMIN_SECRET_KEY` or a cryptographically stable machine seed."
  - "Store admin session tokens in secure `HttpOnly`, `SameSite=Lax` cookies named `bible_admin_session` with a 7-day expiration (604,800s)."
  - "Provide diagnostic telemetry on `/admin/settings`: server uptime, CPU/memory usage via `psutil`, database health for embedded SQLite databases (scripture, songs, subscribers, settings), and cache metrics."
  - "Provide instant administrative actions: Purge HTML Cache, Purge Audio TTS Cache, Toggle WhatsApp Simulation Mode, Ping External Gateway, Manually Trigger Daily Devotional Broadcasts, Toggle RabbitMQ Task Queue, and configure Rate Limiter."
  - "Provide clean session termination via `/admin/logout`, properly clearing the session cookie and redirecting to the login portal."
  - "Execute `scripts/test_admin_settings.py` before releasing administrative changes to ensure 100% coverage of auth guards, session cookies, cache purges, database configuration persistence, and export/import APIs."

dont:
  - "Do not execute periodic polling, background timers, or automatic time-to-time sync loops that mutate or refresh administrative settings without explicit administrator actions."
  - "Do not allow test suites to modify production `data/admin_settings.sqlite.db` or `%LOCALAPPDATA%/HolyBible/config`."
  - "Do not rely on client browser LocalStorage (`localStorage`) or session-dependent memory for system configuration persistence."
  - "Do not refresh administrative configurations back to default settings on server restarts or browser session changes."
  - "Do not expose administrative configuration, cache eviction, or broadcast triggers without authentication."
  - "Do not use standard string comparison (`==`) for password validation; always use `secrets.compare_digest`."
  - "Do not store plaintext passwords or unsigned tokens in client cookies or LocalStorage."
  - "Do not return raw 500 error stack traces on failed administrative actions; return structured JSON payloads."

reason:
  "Centering all administrative settings in a dedicated SQLite database provides an immutable single source of truth across all restarts, updates, and packaging steps, while cryptographic HMAC session tokens and timing-safe authentication protect administrative controls."

