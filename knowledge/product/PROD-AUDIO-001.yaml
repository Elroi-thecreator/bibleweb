id: PROD-AUDIO-001
type: product_standard
title: Audio Bible Text-to-Speech Engine, Deep Bass Modulation, Concurrent Chapter Prefetching & Persistent Audio Cache Standard
domain: product
status: approved
version: 1.14.0
authority:
  level: official
  confidence: high
owner:
  team: product_team

applies_to:
  - frontend
  - static
  - audio_player
  - backend
  - tts

rule:
  "The Audio Bible Text-to-Speech (TTS) synthesizer reads Scripture verses naturally and continuously using Microsoft Edge Neural TTS (edge-tts >= 7.3.1 with Sec-MS-GEC token support) with configurable Voice Tone & Bass Pitch Modulation (+0Hz Normal, -4Hz Warm Bass, -8Hz Deep Bass, -12Hz Heavy Bass) with Male Heavy/Deep Bass voices (en-US-ChristopherNeural, ta-LK-KumarNeural) and -8Hz pitch modulation set as the system default across all endpoints and UI modes, alongside alternative male voices (Brian, Valluvar, Guy) and female neural voices (Pallavi, Jenny, Neerja) with automatic gTTS fallback, strictly omitting editorial brackets (`[...]`), curly braces (`{...}`), footnotes, and cross-reference annotations, displaying per-verse download status badges directly on each verse item, and accelerating chapter downloads using proactive page-load pre-warming (`proactivePrewarmOpeningVerses`, `prewarmReadAlongItem`), a 4-worker concurrent pool (`CONCURRENCY = 4`, `Promise.all(workers)`), two-tier in-memory (`verseAudioBlobs`, `BoundedAudioCache`) and persistent disk (`AUDIO_CACHE_DIR`, `.audio_cache`) caching with in-flight request deduplication (`inFlightRequests`) and 7-day immutable HTTP caching (`Cache-Control: public, max-age=604800, immutable`) to ensure zero-lag instant playback and guarantee no verse is ever downloaded redundantly."

do:
  - "Pin edge-tts >= 7.3.1 in requirements.txt and verify active virtual environment installation to ensure valid Sec-MS-GEC anti-abuse token handshake with Microsoft Edge WebSocket servers."
  - "Support multi-region Tamil Male voices (India: ta-IN-ValluvarNeural, Sri Lanka: ta-LK-KumarNeural Deep Bass, Singapore: ta-SG-AnbuNeural, Malaysia: ta-MY-SuryaNeural) and Female voice (ta-IN-PallaviNeural)."
  - "Support resonant English voices (en-US-ChristopherNeural Deep Bass, en-US-BrianNeural Warm Baritone, en-US-GuyNeural, en-US-JennyNeural, en-IN-NeerjaNeural)."
  - "Provide dedicated Voice Tone & Bass controls across the persistent Reader Audio Dock (`#audio-pitch-select`), Global Settings Modal (`#setting-audio-pitch`), and Read-Along Prayer mode (`cycleAudioBass()`)."
  - "Display compact per-verse audio status indicators identically across all reader modes (`reader.html` `#verse-audio-status-${idx}` and `read_along.html` `#readalong-status-...`) showing Downloading (animated spinner), Ready/Downloaded (emerald checkmark), or Playing (pulsing speaker)."
  - "Preserve both Tamil and English clean verse texts directly on DOM data attributes (`data-text-ta`, `data-text-en`) on every verse element in `reader.html` and `read_along.html` to guarantee flawless audio downloads across all display modes (Bilingual, Tamil only, English only)."
  - "Enable seamless verse click-to-play across both reader interfaces (`reader.html` and `read_along.html`) where clicking the verse number, badge, or verse item immediately streams or replays from local in-memory blob cache."
  - "Store downloaded verse audio blobs in memory (`verseAudioBlobs` Map with local `blobUrl`) so that any clicked verse plays instantly with zero network calls if already downloaded."
  - "Track in-flight download promises (`inFlightRequests` Map) to guarantee that concurrent clicks or prefetch overlaps never trigger duplicate or redundant network requests."
  - "Proactively pre-warm opening verses (`proactivePrewarmOpeningVerses()`, `prewarmReadAlongItem()`) quietly during idle page load and intro countdown so clicking Play starts audio in 0ms."
  - "Start the chapter background prefetch pipeline immediately upon initiating playback in `playCurrent()` / `playQueueIndex()`, downloading upcoming verses concurrently with verse 0."
  - "Execute background prefetching using a 4-worker concurrent pool (`CONCURRENCY = 4`, `Promise.all(workers)`) across both `audio_player.js` and `read_along.html` to accelerate chapter verse prefetching up to the end of the chapter."
  - "Prime the `<audio>` preloader element with the immediate next verse (`currentIndex + 1`) as soon as worker 0 completes its download, eliminating all transition latency between verses."
  - "Persist synthesized audio byte buffers to local disk storage (`AUDIO_CACHE_DIR`, `.audio_cache`) in `BoundedAudioCache` so subsequent chapter playbacks or app restarts retrieve audio in < 1ms without remote TTS synthesis."
  - "Normalize incoming speech pitch parameters (`normalize_speech_pitch`) supporting presets ('normal', 'warm_bass', 'bass', 'base', 'more_base', 'extra_bass') and valid Edge-TTS regex (`^[+-]\\d+Hz$`)."
  - "Include `target_pitch` in LRU and client cache keys (`{target_voice}:{target_rate}:{target_pitch}:{clean_text}`) and return `X-TTS-Pitch` headers to prevent cross-tone cache collision."
  - "When streaming TTS audio via `/api/audio/stream`, prioritize requested neural voice, then gracefully attempt same-gender alternative neural voices before falling back to gTTS."
  - "Return `Cache-Control: public, max-age=604800, immutable` from `/api/audio/stream` to allow client-side persistent HTTP caching alongside server in-memory LRU caching and disk persistence."
  - "If an audio prefetch request fails or returns non-200, automatically retry up to 3 times with exponential backoff (400ms, 800ms) to ensure guaranteed verse availability."
  - "Enforce strict boundary guards when prefetching so that playing the last verse of a chapter, single-verse chapters, or ending a queue never fails, throws index errors, or attempts out-of-bounds audio synthesis."
  - "Before dispatching verse text to TTS, strip out all text enclosed in square brackets `\\[.*?\\]` and curly braces `\\{.*?\\}` using regex pre-processing."
  - "Highlight the currently active verse on the screen synchronously with the audio speech synthesizer so readers can follow along visually."
  - "Provide intuitive Play, Pause, Resume, Stop, Next/Previous, Rate, and Bass Tone controls with keyboard shortcuts (Spacebar for Play/Pause)."
  - "Maintain continuous playback by automatically advancing to the next verse until the chapter completes."
  - "Insert a 1-second meditative pause (`setTimeout(..., 1000)`) between consecutive verses upon audio playback completion to allow readers to reflect on each Scripture verse comfortably before advancing."
  - "Cleanly cancel pending verse transition timers (`transitionTimeout`, `readalongTransitionTimeout`) whenever the user pauses, steps forward/backward, stops, or clicks on a verse to eliminate unexpected skips or double advances."
  - "Guard asynchronous verse loading with `requestedIndex` checks (`if (this.currentIndex !== requestedIndex || !this.isPlaying) return;`) to ensure out-of-order promise resolutions never hijack user navigation."
  - "Implement universal `togglePlayPause()` method across audio docks and controls to smoothly handle unstarted, playing, and paused states with zero dead-clicks."
  - "Ensure immediate and unconditional pause responsiveness across all audio states (active playback, in-flight verse network download, and the 1-second inter-verse gap) by checking `this.isPaused` / `!isAudioPlaying` immediately following asynchronous operations (`ensureVerseAudioDownloaded`, `readalongInFlight`, `audio.play()`) and wrapping pause calls in error-tolerant blocks to safely absorb browser `AbortError`."
  - "Render initial play/pause buttons with play icon `▶` in server-rendered templates (`reader.html` `#audio-play-pause-btn`) so initial visual state strictly matches idle audio."
  - "When playback pauses or halts, immediately revert playing verse badges back to 'downloaded' (if in memory cache) or 'idle' to eliminate stale pulsing indicators."
  - "Safely pause `<audio>` elements before revoking blob object URLs (`URL.revokeObjectURL`) inside `clearAllBlobs()` to prevent browser audio decoder abort exceptions."
  - "Centralize voice engine selection exclusively in the Settings Page/Modal (`#setting-voice-ta`, `#setting-voice-en`) to keep audio player docks lightweight, uncluttered, and mobile-friendly."
  - "Display real-time audio playback progress prominently across mobile and desktop views using interactive seek tracks (`#audio-progress-bar`, `#readalong-mobile-progress-bar`), verse counters (`#audio-progress-count`, `#mobile-progress-count`, e.g. `1/51`), and time indicators (`#audio-time-label`)."
  - "Execute complete end-to-end flow verification (`test_audio_flow_e2e.py`, `test_audio_deduplication.py`, `test_audio_concurrency_and_cache.py`, `test_audio.py`, `test_robustness.py`) prior to pushing code to source control."

dont:
  - "Do not pin or run older edge-tts versions (< 7.3.1) which cause WSServerHandshakeError: 403 on Microsoft's Bing platform."
  - "Do not download audio for the same verse more than once; always verify `verseAudioBlobs` and `inFlightRequests` before initiating an HTTP GET."
  - "Do not re-fetch audio over the network if a user clicks on an already downloaded verse; immediately stream from the local cached `blobUrl`."
  - "Do not wait for verse 0 to finish downloading or start playing before initiating upcoming verse prefetching; launch concurrent chapter prefetch immediately."
  - "Do not run a single-threaded sequential prefetch loop when prefetching upcoming verses; use a 3-worker concurrency pool."
  - "Do not fall back immediately to female gTTS when a male voice is requested if alternative neural male voices are reachable."
  - "Do not omit pitch from cache key hashing, which causes cross-tone collision when toggling between standard and bass voices."
  - "Do not read translator notes, editorial insertions, or manuscript variant markers enclosed in `[]` or `{}` aloud."
  - "Do not flood the network beyond concurrency limits; cap prefetch concurrency at 3 workers to prevent Microsoft Edge-TTS rate limiting."
  - "Do not attempt to prefetch beyond the chapter's verse array length on the last verse."
  - "Do not allow background prefetch failures or network blips to interrupt or halt the currently playing audio stream."
  - "Do not block UI scrolling or responsiveness during speech synthesis."
  - "Do not default to female neural voices; default to resonant Male Heavy/Deep Bass voices (Christopher and Kumar at -8Hz) across all languages."
  - "Do not crowd reader audio docks with voice selection dropdowns; route neural voice configurations through the dedicated Global Settings modal."
  - "Do not hide audio progress counters or playback bars on mobile viewports."
  - "Do not abruptly jump to the next verse with zero gap upon verse completion; enforce a 1-second meditative pause between consecutive verses."
  - "Do not allow asynchronous promise completions (such as verse download resolution or `.play().then(...)`) to override or bypass a user's pause command."

reason:
  "Showing real-time download status on each verse gives readers instant visual confirmation of audio availability. Coupling immediate parallel 3-worker prefetching with two-tier in-memory and persistent disk caching drops chapter verse prefetch times by over 3.5x and provides sub-millisecond instant audio playback for subsequent listens, all while preventing duplicate requests."

