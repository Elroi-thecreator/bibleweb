id: PROD-SONGS-001
type: product_standard
title: Christian Song Lyrics, Hymnal Presentation & Dual-Page Search Standard
domain: product
status: approved
version: 1.6.1
authority:
  level: official
  confidence: high
owner:
  team: product_team

applies_to:
  - backend
  - frontend
  - database
  - songs
  - search

rule:
  "The application must host, organize, and present Christian song lyrics headlined by Jebathota Jeyageethangal across all 40 volumes by Fr. S.J. Berchmans (1,167 songs), classic Tamil Christian hymns, and dedicated contemporary worship collections by Dr. Joseph Aldrin (25 songs), Pastor Benny Joshua (25 songs), and Pastor John Jebaraj (25 songs) with bilingual Tamil script, Romanised transliteration, volume/author navigation, 100% YouTube video/audio coverage across all 1,582 songs (with direct video embedding for known IDs and high-precision official streaming links as fallback), flowing liturgical hymnal presentation with chorus highlighting, and dedicated multi-scope song search options on both the landing directory and individual song details pages."

do:
  - "Store all song metadata, volumes, numbers, titles, and bilingual stanza structures in the dedicated local embedded SQLite database (`data/songs.sqlite.db`) within `songs` and `song_books` tables."
  - "Structure and parse all `lyrics_bilingual` stanzas with explicit array keys `lines_ta` (list of Tamil lyric lines) and `lines_en` (list of English transliteration lines), while providing defensive backend normalization in `get_song_by_id()` for raw multiline strings or unparsed text."
  - "Provide dedicated songbook categories for classic and contemporary worship leaders: Jebathota Jeyageethangal (`jebathota`), Keerthanai (`keerthanai`), Seyalveerar Paadalgal (`seyalveerar`), TAC (`tac`), Aikkiya Geethangal (`aikkiya`), Dr. Joseph Aldrin (`aldrin`), Pastor Benny Joshua (`benny`), and Pastor John Jebaraj (`johnjebaraj`)."
  - "Ensure 100% of songs in `data/songs.sqlite.db` possess a valid, appropriate `youtube_url` (direct video watch URL for mapped tracks and official YouTube streaming search URL for others)."
  - "Maintain 100% direct verified YouTube video coverage across all tracks in Dr. Joseph Aldrin, Pastor Benny Joshua, and Pastor John Jebaraj songbooks with verified 200 OK oEmbed watch URLs."
  - "Reverify and audit Pastor John Jebaraj's 25 songs against official discography (John Jebaraj - Official, Holy Gospel Music / LEVI albums), ensuring 100% authentic artist attribution, valid 200 OK streaming video IDs, and signature worship hits (including Uyar Malaiyo Samaveliyo, Oseh Pele, Oruvanaai Irukkayil, Azhagae, and Thuthi Umakkae)."
  - "Maintain 100% direct embedded YouTube video coverage across all 1,167 Jebathota Jeyageethangal songs (`https://www.youtube.com/watch?v=...`) covering Volumes 1 through 40 and all uncataloged volume-0 choruses."
  - "Actively audit all video links against YouTube's live oEmbed verification endpoints (200 OK) to automatically detect and heal 404s, private/restricted, or deleted videos using high-confidence replacement searches."
  - "Actively maintain and update direct video IDs with official verified releases (e.g. replacing inactive/404 legacy video IDs with verified official publisher uploads like `7bBsJE2RsxQ` for Jebathota Jeyageethangal Vol 9 #124)."
  - "Extract and expose `youtube_video_id` (11-character identifier) in `get_song_by_id()` for seamless responsive iframe embedding."
  - "Embed videos exclusively via YouTube Privacy-Enhanced Mode (`https://www.youtube-nocookie.com/embed/{id}?rel=0&modestbranding=1&iv_load_policy=3`) to disable advertising cookies, suppress third-party tracking beacons, prevent external recommendations, and reduce ad intrusions."
  - "Present a high-precision YouTube Stream Card on song detail pages when an official search stream is linked, providing single-tap playback."
  - "Display a YouTube indicator badge (`▶️ Watch`) on song cards in the `/songs` directory to indicate immediate video/audio playback."
  - "Present song lyrics in a flowing sacred hymnal layout where the Chorus (பல்லவி) is prominently highlighted with warm amber accent borders, repeat indicators, and soft background glow, avoiding disjointed boxed cards per stanza."
  - "Provide dedicated in-page song search directly on the song details page (`/songs/{id}`) with scope toggles (In Current Volume vs All 40 Volumes), live autocomplete suggestions, and keyboard shortcut `/`."
  - "Provide dedicated multi-scope search options on the songs landing page (`/songs`) allowing users to filter across All Volumes, Current Volume Only, or All Hymnals with live typeahead suggestions."
  - "Provide a quick in-volume song selector dropdown on the song details page enabling worship leaders to jump between songs in the same volume without leaving the reader view."
  - "Support one-click script toggles between Tamil script only (`தமிழ்`), Romanised English transliteration (`English`), and bilingual stacked display (`இருமொழியும்`)."
  - "Include one-click clipboard copying of song lyrics and a distraction-free worship presentation mode (Focus Mode)."
  - "Support sequential song navigation (`← Prev Song` and `Next Song →`) with Left/Right arrow keyboard shortcuts."

dont:
  - "Do not embed third-party scraper frontends (such as Invidious/yewtu.be or Piped) that trigger anti-bot Cloudflare/CAPTCHA challenge loops inside cross-origin iframes."
  - "Do not leave `youtube_url` null or empty; always map known video IDs or provide appropriate high-precision YouTube search links."
  - "Do not present lyrics as rigid form boxes that fragment musical flow; maintain a continuous, publication-grade hymnal sheet layout."
  - "Do not force users to leave the song reader view just to search for another song or change tracks within the same volume."
  - "Do not merge song data into `bible.sqlite.db` or create cross-database foreign key constraints that prevent standalone song corpus updates."
  - "Do not drop Romanised transliterations; preserve them for non-Tamil readers and diaspora congregations."

reason:
  "Praise, worship, and hymn singing require intuitive usability during church services, choir practice, and personal devotions. Modern Tamil worship collections from leaders like Dr. Joseph Aldrin, Pastor Benny Joshua, and Pastor John Jebaraj are integral to congregational life alongside traditional hymns and Jebathota Jeyageethangal. Unified hymnal styling with distinct chorus prominence allows vocalists to follow along seamlessly. Ensuring every single song links directly to its appropriate YouTube video or recording gives believers immediate musical accompaniment for singing along."

