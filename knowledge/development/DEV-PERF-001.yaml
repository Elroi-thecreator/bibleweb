id: DEV-PERF-001
type: development_standard
title: Asynchronous Load Testing, Concurrency Saturation & Capacity Benchmarking Standard
domain: development
status: approved
version: 1.4.0
authority:
  level: official
  confidence: high
owner:
  team: backend_team

applies_to:
  - backend
  - database
  - benchmarking
  - deployment

rule:
  "All backend optimizations, concurrency adjustments, and web deployments must be benchmarked using the asynchronous load testing suite (`scripts/load_test.py`) to measure throughput (RPS), latency percentiles (p50, p95, p99), error rates, and worker saturation limits."

do:
  - "Use `scripts/load_test.py` with `aiohttp` to simulate concurrent user sessions without adding external commercial test runner dependencies."
  - "Benchmark both isolated scenarios (`health`, `reader`, `search`, `songs`, `quiz`) and mixed weighted user simulations (`--scenario mixed`)."
  - "Run concurrency ramping (`--scenario ramp`) across concurrency levels [5, 15, 30, 60, 120, 250, 500] to map the saturation curve and determine peak capacity."
  - "Scale Uvicorn workers (`--workers 4` or `(2 * CPU) + 1`) via `scripts/run_server.py` in production web deployments to unblock CPU-bound Jinja2 template rendering and maximize multi-core throughput."
  - "Mount `BrotliMiddleware` (with `GZipMiddleware` fallback) in `app/main.py` with `minimum_size=1000` to compress text, HTML, and JSON responses by >91% (reducing 310 KB reader HTML to 25.7 KB under Brotli and 27.5 KB under Gzip)."
  - "Verify compression headers and decompression roundtrip integrity using `scripts/test_compression.py`."
  - "Expose real-time Windows Process Registry telemetry via `/api/system/process-registry` tracking worker PIDs, active OS handles, thread counts, RSS memory, and event loop implementations."
  - "Maintain high-throughput standards established via the quadruple-optimization architecture (SQLite FTS5, verse LRU caching, `BoundedHTMLCache` pre-rendered HTML response caching, and `asyncio.to_thread`):"
    - "Mixed Multi-Page Throughput: Reaches **346.4 RPS** under 750 concurrency and **329.6 RPS** under 1,000 concurrency with **0.00% error rate** (+170% throughput improvement over un-cached Jinja2 rendering)."
    - "Queue Latency Halved: Under 1,000 concurrency, $p_{50}$ latency dropped from 4,171 ms to **2,028 ms** (-51.4%) and $p_{95}$ dropped from 6,658 ms to **3,636 ms**."
    - "500 Concurrency Throughput: Reaches **294.7 RPS** (up from 136.8 RPS, a +115.4% increase) with $p_{50}$ latency dropped to **1,235 ms**."
  - "Maintain awareness of single-host failure thresholds identified via `scripts/stress_breakpoint_test.py`:"
    - "Capacity Limit (100% Stability): Up to 1,000 concurrent connections sustains 329.6 RPS with 0.00% error rate and <3.6s p95 tail latency."
    - "Complete Failure Threshold: 1,250 - 1,500 concurrent connections on Windows (due to Winsock `select.select()` hard C-runtime limit of `FD_SETSIZE = 512` descriptors per worker under `_WindowsSelectorEventLoop`)."
    - "Windows Multi-Process IOCP Constraint: Multi-worker Uvicorn cannot use `ProactorEventLoop` across child processes because Windows IOCP raises `WinError 87` when multiple processes attempt to register the same parent listening socket with different completion ports."
    - "Production Scaling: In Linux/Docker environments, Uvicorn utilizes `uvloop` (Linux `epoll` with `SO_REUSEPORT`), completely bypassing the 512 descriptor limit to scale to 50,000+ concurrent connections."
    - "System Resilience: SQLite databases and thread-local connection pools remain 100% uncorrupted during and after total load failure; deep health verification returns ok in <1 second once traffic clears."

dont:
  - "Do not rely exclusively on single-worker benchmarks to assess multi-core production server potential."
  - "Do not execute synchronous database queries directly on the asyncio event loop under high concurrent loads."
  - "Do not deploy scripture search relying solely on unindexed table scans with `LIKE '%query%'`."
  - "Do not deploy high-concurrency write transactions into SQLite without testing lock contention in WAL mode."
  - "Do not execute load tests against external third-party neural TTS streaming endpoints (`/api/audio/stream`) to prevent upstream rate-limiting."

reason:
  "FastAPI and SQLite deliver sub-millisecond local queries, but single-worker event loops can be bottlenecked by heavy Jinja2 template serialization and unpooled SQLite connections. Standardized load testing ensures predictable performance and guides infrastructure sizing."

