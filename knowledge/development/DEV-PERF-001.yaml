id: DEV-PERF-001
type: development_standard
title: Asynchronous Load Testing, Concurrency Saturation & Capacity Benchmarking Standard
domain: development
status: approved
version: 1.6.0
authority:
  level: official
  confidence: high
owner:
  team: backend_team

applies_to:
  - backend
  - database
  - benchmarking
  - deployment

rule:
  "All backend optimizations, concurrency adjustments, and web deployments must be benchmarked using the asynchronous load testing suite (`scripts/load_test.py` and `scripts/stress_breakpoint_test.py`) to measure throughput (RPS), latency percentiles (p50, p95, p99), error rates, circuit-breaker overload shedding, and worker saturation limits, while strictly enforcing memory ceilings based on hosting platform instance quotas."

do:
  - "Enforce strict memory-budgeted worker and cache sizing according to deployment tiers: on memory-constrained PaaS environments (e.g., Render Free/Starter tier with 512 MB RAM ceiling), configure `WEB_CONCURRENCY=1`, `PAGE_CACHE_SIZE=128`, and `AUDIO_CACHE_SIZE=30` with auto-detected `RENDER` environment defaults (SQLite mmap 16MB, cache -2000) so process RSS remains stable at ~90-120 MB (providing ~400 MB of safety headroom to prevent container OOM SIGKILL restarts)."
  - "Use `scripts/load_test.py` and `scripts/stress_breakpoint_test.py` with `aiohttp` to simulate concurrent user sessions without adding external commercial test runner dependencies."
  - "Benchmark both isolated scenarios (`health`, `reader`, `search`, `songs`, `quiz`) and mixed weighted user simulations (`--scenario mixed`)."
  - "Run concurrency ramping across concurrency levels [300, 500, 750, 1000, 1250, 1500, 1750, 2000] to map the saturation curve and verify circuit breaker overload shedding."
  - "Scale Uvicorn workers (`--workers 4` or `(2 * CPU) + 1`) via `scripts/run_server.py` in production VM / dedicated container deployments (>2GB RAM) to unblock CPU-bound Jinja2 template rendering and maximize multi-core throughput."
  - "Tune Uvicorn network socket parameters: `--backlog 2048`, `--timeout-keep-alive 20`, and `--limit-concurrency 350` per worker on Windows (`FD_SETSIZE 512` boundary) to trigger graceful HTTP 503 shedding instead of Winsock process crashes."
  - "Implement Pre-Compressed Brotli & Gzip Buffer Caching in `BoundedHTMLCache` in `app/main.py`: generate `.br` (quality 4) and `.gzip` (level 5) once on first render. Routes return pre-compressed bytes with `Content-Encoding: br/gzip` directly, bypassing `BrotliMiddleware` runtime compression with 0 ms CPU overhead."
  - "Verify compression headers, Brotli/Gzip caching, and decompression roundtrip integrity using `scripts/test_robustness.py`."
  - "Expose real-time Windows Process Registry telemetry via `/api/system/process-registry` tracking worker PIDs, active OS handles, thread counts, RSS memory, and event loop implementations."
  - "Maintain high-throughput standards established via the quintuple-optimization architecture (SQLite FTS5, verse LRU caching, pre-compressed `BoundedHTMLCache`, Uvicorn socket tuning, and `asyncio.to_thread`):"
    - "Peak Throughput: Reaches **642.8 RPS** under 500 concurrency and **510.7 RPS** under 1,000 concurrency with **0.00% error rate** (+319% throughput improvement over baseline 121.8 RPS)."
    - "Queue Latency Halved: Under 1,000 concurrency, $p_{50}$ latency dropped to **1,733 ms** (down from 4,171 ms baseline, a -58.4% reduction) with $p_{95}$ at **1,858 ms**."
    - "500 Concurrency Performance: Delivers **642.8 RPS** with $p_{50}$ latency of **735 ms** and $p_{95}$ of **833 ms**."
    - "Zero-Crash Overload Protection: Under extreme overload (1,500 - 2,000 concurrency), Uvicorn's circuit breaker sheds excess traffic cleanly via HTTP 503 while all 4 worker processes survive 100% healthy (~1,024 total handles, 339 MB total RSS)."
  - "Maintain awareness of single-host capacity thresholds identified via `scripts/stress_breakpoint_test.py`:"
    - "Zero-Error Stability Threshold: Up to 1,250 concurrent connections sustains 467.0 RPS with 0.00% error rate and zero dropped sockets."
    - "Adaptive Circuit Breaking Threshold: Above 1,250 concurrency on Windows, `limit_concurrency = 350` per worker sheds excess requests via HTTP 503, shielding `_WindowsSelectorEventLoop` from exceeding Winsock's C-runtime `FD_SETSIZE = 512` ceiling."
    - "Windows Multi-Process IOCP Constraint: Multi-worker Uvicorn cannot use `ProactorEventLoop` across child processes because Windows IOCP raises `WinError 87` when multiple processes attempt to register the same parent listening socket with different completion ports."
    - "Production Scaling: In Linux/Docker environments, Uvicorn utilizes `uvloop` (Linux `epoll` with `SO_REUSEPORT`), completely bypassing the 512 descriptor limit to scale to 50,000+ concurrent connections."
    - "System Resilience: SQLite databases and thread-local connection pools remain 100% uncorrupted during and after total load failure; deep health verification returns ok in <1 second once traffic clears."

dont:
  - "Do not configure multi-worker Uvicorn (`WEB_CONCURRENCY > 1`) on instances or containers with 512 MB RAM or less (such as Render Free Tier), as 4 worker processes consume ~450 MB baseline RSS and immediately trigger Out-of-Memory (OOM) eviction during traffic spikes."
  - "Do not maintain unbounded in-memory audio/binary caches; always bound with thread-safe LRU eviction (`BoundedAudioCache`) to prevent memory leaks from audio streaming."
  - "Do not rely exclusively on single-worker benchmarks to assess multi-core production server potential."
  - "Do not execute synchronous database queries directly on the asyncio event loop under high concurrent loads."
  - "Do not deploy scripture search relying solely on unindexed table scans with `LIKE '%query%'`."
  - "Do not deploy high-concurrency write transactions into SQLite without testing lock contention in WAL mode."
  - "Do not execute load tests against external third-party neural TTS streaming endpoints (`/api/audio/stream`) to prevent upstream rate-limiting."

reason:
  "FastAPI and SQLite deliver sub-millisecond local queries, but single-worker event loops can be bottlenecked by heavy Jinja2 template serialization and unpooled SQLite connections. Standardized load testing ensures predictable performance and guides infrastructure sizing."

