id: DEV-TEST-001
type: development_standard
title: Automated Verification, Route Integrity & Standalone Executable Smoke Testing
domain: development
status: approved
version: 1.0.0
authority:
  level: official
  confidence: high
owner:
  team: quality_assurance

applies_to:
  - backend
  - windows_app
  - ci_cd

rule:
  "Every change to backend routes, database schema, audio logic, or desktop packaging must pass automated validation and smoke tests before committing or publishing release tags."

do:
  - "Verify FastAPI route integrity using `pytest` and `httpx.AsyncClient` or FastAPI `TestClient`."
  - "Verify that empty query string navigations on user-facing routes (such as `/search`) return 200 HTML responses instead of 422 JSON validation errors."
  - "Verify SQLite queries for verse counts across both Catholic (73 books) and Protestant (66 books) canons."
  - "Validate that `windows_app/app.py` boots in headless/smoke mode without throwing unhandled exceptions."
  - "Verify that WinGet manifest generator (`windows_app/generate_winget_manifest.py`) outputs valid schema v1.6.0 YAML matching the compiled executable's SHA256."
  - "Ensure `git status` remains clean of temporary PyInstaller artifacts or SQLite journal files (`.db-journal`, `.db-wal`)."

dont:
  - "Do not commit changes with broken verse retrieval queries."
  - "Do not generate releases without matching binary SHA256 checksums."
  - "Do not bypass GitHub Actions workflow checks."

reason:
  "Automated gate checks prevent regressions across web users and preserve seamless desktop distribution through Microsoft WinGet."

related_items:
  - ARCH-SYS-001
  - ARCH-DIST-001
  - DEV-BUILD-001
