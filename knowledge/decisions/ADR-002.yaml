id: ADR-002
type: decision_record
title: Local-First Embedded SQLite Database over External Cloud Database
domain: decisions
status: accepted
version: 1.1.0
authority:
  level: official
  confidence: high
owner:
  team: core_architecture

context:
  "Scripture reading and study applications require instantaneous chapter transitions, offline reliability without Internet connectivity, and zero server maintenance costs for personal desktop users."

decision:
  "We selected an embedded SQLite database (`data/bible.sqlite.db`) bundled directly into the distribution and accessed with Python's standard library `sqlite3`, thread-local connection caching, memory-mapped I/O, SQLite FTS5 full-text indexing, and composite indexing, with song lyrics later isolated into a separate database (`data/songs.sqlite.db`)."

consequences:
  positive:
    - "100% offline functionality for both web hosting and portable desktop app."
    - "Zero cloud database bills or external network roundtrip latency."
    - "Trivial backup and deployment: the entire bilingual multi-canon Scripture database is embedded locally (~47.68 MB)."
    - "Sub-millisecond query execution using memory-mapped I/O and FTS5 full-text search."
  negative:
    - "Schema migrations or text updates require database file redistribution."
    - "Must stay strictly under Git 50 MB threshold, which necessitated decoupling song lyrics into ADR-004."

related_items:
  - ARCH-DATA-001
  - DEV-PY-001
  - ADR-004
