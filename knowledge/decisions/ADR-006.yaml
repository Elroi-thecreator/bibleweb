id: ADR-006
type: architecture_decision_record
title: Asynchronous RabbitMQ Task Queue Option for Decoupled WhatsApp Message Ingestion & Devotional Dispatching
domain: architecture
status: approved
version: 1.1.0
authority:
  level: official
  confidence: high
owner:
  team: core_architecture

applies_to:
  - backend
  - whatsapp_gateway
  - queue
  - rabbitmq
  - routes

rule:
  "The WhatsApp gateway provides an asynchronous task queue layer powered by RabbitMQ (using `aio-pika`) to decouple incoming webhook ingestion from heavy message processing and to buffer all outgoing requests from the web bible to the remote WA-AKG gateway (`https://wa-akg-gateway-ub6a.onrender.com/`). Because the remote gateway on Render can spin down due to inactivity, all outgoing requests are queued as persistent RabbitMQ messages and only dispatched when the gateway is verified to be actively running. The consumer holds messages and periodically pings the gateway to trigger container spin-up during cold starts. If RabbitMQ is disabled (`WA_QUEUE_ENABLED=false`) or the broker is unreachable, operations gracefully and automatically execute directly in-memory, ensuring continuous availability across lightweight desktop deployments and offline development environments."

do:
  - "Implement the RabbitMQ queue abstraction inside `whatsapp_gateway/queue/` containing distinct `connection.py`, `publisher.py`, `consumer.py`, and `manager.py` modules."
  - "Push all requests from web bible (text, audio media, devotional broadcasts, and bot replies) as persistent RabbitMQ messages (`whatsapp_outgoing_messages`) via `WAClient` and `QueueManager`."
  - "Check gateway availability via `client.is_gateway_running()` in the outgoing task consumer before dispatching, and pause/poll via `client.wait_until_gateway_running()` while the gateway is cold-starting or offline on Render."
  - "Ensure `direct_http=True` is passed by queue consumers when executing actual HTTP calls to the gateway to prevent recursive re-enqueueing."
  - "Support Base64-encoded media serialization in `QueueTask` for audio scripture and voice notes (`TaskType.OUTGOING_MEDIA`)."
  - "Decouple incoming webhook ingestion (`whatsapp_incoming_messages`) so that FastAPI endpoints return immediate HTTP 200/202 responses (< 5ms) to WA-AKG while background workers asynchronously synthesize audio and dispatch bot answers."
  - "Queue outgoing messages and broadcasts (`whatsapp_outgoing_messages`) to enable controlled concurrency, prefetch throttling (`WA_QUEUE_PREFETCH=10`), and rate-limited dispatching without flooding WhatsApp multi-device sockets."
  - "Implement durable queues with persistent delivery mode (`delivery_mode=PERSISTENT`) to safeguard message tasks across worker restarts."
  - "Mask user credentials and passwords in AMQP URLs (`amqp://user:••••••••@host:5672/`) across all log streams, exception traces, and telemetry API responses."
  - "Provide a transparent fallback mechanism: if `queue_enabled=True` but the broker is unreachable, catch connection errors, log a clear warning, and immediately fall back to direct in-memory execution so zero incoming messages are lost."
  - "Support dynamic runtime queue toggling and configuration via `/api/whatsapp/queue/toggle` and `/api/whatsapp/queue/config` with persistence in `data/whatsapp_config.json`."
  - "Expose comprehensive queue telemetry (`enabled`, `backend`, `connected`, `gateway_url`, `queues`, `metrics` for enqueued/processed/failed tasks) under `/api/whatsapp/status` and `/api/whatsapp/queue/status`."
  - "Hook queue startup (`queue_manager.start()`) and shutdown (`queue_manager.stop()`) cleanly into FastAPI's `lifespan` context manager in `app/main.py`."

dont:
  - "Do not make RabbitMQ a hard dependency that blocks server boot or crashes the application if port 5672 is closed or unreachable."
  - "Do not expose plaintext passwords in RabbitMQ connection URLs in API status outputs or log messages."
  - "Do not block the FastAPI event loop with synchronous AMQP operations; use non-blocking `aio-pika` async channels exclusively."
  - "Do not drop or silently ignore incoming webhook messages when RabbitMQ encounters transport errors; immediately fallback to direct in-memory dispatch."

reason:
  "Decoupling webhook ingestion from computationally intensive speech synthesis (Edge-TTS + FFmpeg M4A transcoding) and bulk devotional broadcasts prevents HTTP request timeouts on upstream WA-AKG webhooks and eliminates worker congestion. Retaining an automatic direct fallback mode guarantees zero breakage for local testing, desktop packaging, and environments operating without an active RabbitMQ message broker."

related_items:
