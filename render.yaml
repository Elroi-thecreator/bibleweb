services:
  # =========================================================
  # 1. Holy Bible Main Web Server (FastAPI + Embedded SQLite)
  # =========================================================
  - type: web
    name: elroi-bible
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_PATH
        value: ./data/bible.sqlite.db
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: WEB_CONCURRENCY
        value: "1"
      - key: PAGE_CACHE_SIZE
        value: "128"
      - key: AUDIO_CACHE_SIZE
        value: "30"
      - key: WA_SIMULATION_MODE
        value: "false"
      - key: WA_SESSION_ID
        value: default
      - key: WA_GATEWAY_URL
        value: https://wa-akg-gateway-ub6a.onrender.com/api

  # =========================================================
  # 2. WA-AKG WhatsApp Gateway (Next.js + Baileys + Prisma)
  # =========================================================
  - type: web
    name: wa-akg-gateway
    runtime: node
    plan: free
    region: singapore
    repo: https://github.com/mrifqidaffaaditya/WA-AKG.git
    branch: main
    buildCommand: npm install --legacy-peer-deps && sed -i 's/"mysql"/"postgresql"/g' prisma/schema.prisma && npx prisma generate && npm run build
    startCommand: npx prisma db push --accept-data-loss && node scripts/setup-admin.js admin@example.com admin123 && npm run start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: PORT
        value: "3000"
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: NEXTAUTH_URL
        value: https://wa-akg-gateway-ub6a.onrender.com
      - key: DATABASE_URL
        sync: false
