services:
  holybible:
    build: .
    container_name: holybible
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - URL_PREFIX=
      - HOST=0.0.0.0
      - PORT=8000
      - WEB_CONCURRENCY=2
      - PAGE_CACHE_SIZE=512
      - AUDIO_CACHE_SIZE=500
    volumes:
      - ./data:/app/data
      - ./.audio_cache:/app/.audio_cache
