<!DOCTYPE html>
<html lang="ta" class="h-full bg-black text-white">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ book.name_en }} {{ chapter }} - Church Presentation Mode</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Serif+Tamil:wght@600;700&family=Source+Serif+4:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .font-presenter-en { font-family: 'Source Serif 4', serif; }
        .font-presenter-ta { font-family: 'Noto Serif Tamil', serif; line-height: 1.8; }
        .font-title { font-family: 'Cinzel', serif; }
        .screen-black { background-color: #000 !important; color: transparent !important; }
        .screen-white { background-color: #fff !important; color: transparent !important; }
    </style>
</head>
<body class="h-full select-none flex flex-col justify-between overflow-hidden p-6 sm:p-12 transition-colors duration-150">

    <!-- Top Presentation Bar -->
    <header class="flex items-center justify-between border-b border-stone-800 pb-4 opacity-70 hover:opacity-100 transition-opacity">
        <div class="flex items-center space-x-3">
            <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
            <h1 class="font-title text-xl font-bold tracking-wider text-amber-400">{{ book.name_en }} {{ chapter }}</h1>
            <span class="font-presenter-ta text-lg text-stone-300">({{ book.name_ta }})</span>
        </div>

        <div class="flex items-center space-x-3 text-xs">
            <span id="slide-indicator" class="font-mono text-stone-400 font-bold text-sm">Verse 1 / {{ verses|length }}</span>
            <button onclick="toggleFullscreen()" class="px-2.5 py-1 bg-stone-800 hover:bg-stone-700 rounded border border-stone-700">⛶ Fullscreen (F)</button>
            <a href="/read/{{ book.id }}/{{ chapter }}" class="px-2.5 py-1 bg-rose-900/60 hover:bg-rose-900 rounded border border-rose-800">✕ Exit</a>
        </div>
    </header>

    <!-- Main Presentation Stage -->
    <main id="stage" class="flex-1 flex flex-col justify-center items-center text-center max-w-6xl mx-auto py-8">
        
        <!-- Verse Number Pill -->
        <div class="mb-6">
            <span id="verse-badge" class="font-title text-xl sm:text-2xl font-bold text-amber-500 tracking-widest uppercase px-4 py-1.5 rounded-full border border-amber-500/40 bg-amber-950/30">
                {{ book.name_en }} {{ chapter }}:1
            </span>
        </div>

        <!-- Bilingual Split Slides -->
        <div class="space-y-6 sm:space-y-8 w-full">
            <!-- English Text -->
            <p id="present-text-en" class="font-presenter-en text-2xl sm:text-4xl md:text-5xl font-semibold leading-relaxed text-stone-100 drop-shadow-md">
                {{ verses[0].text_en }}
            </p>
            
            <!-- Tamil Text -->
            <p id="present-text-ta" class="font-presenter-ta text-2xl sm:text-4xl md:text-5xl font-bold text-amber-300 drop-shadow-md">
                {{ verses[0].text_ta }}
            </p>
        </div>
    </main>

    <!-- Footer Controls -->
    <footer class="flex items-center justify-between border-t border-stone-800 pt-4 text-xs text-stone-500">
        <div class="flex items-center space-x-4">
            <span>[← / → / Space] Next/Prev</span>
            <span>[B] Black Screen</span>
            <span>[W] White Screen</span>
            <span>[F] Fullscreen</span>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="prevSlide()" class="px-4 py-2 bg-stone-900 hover:bg-stone-800 text-white rounded-lg border border-stone-700 text-sm">◀ Previous</button>
            <button onclick="nextSlide()" class="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-lg text-sm">Next ▶</button>
        </div>
    </footer>

    <script>
        const verses = {{ verses | tojson }};
        let currentIdx = 0;
        const bookNameEn = "{{ book.name_en }}";
        const chapter = {{ chapter }};

        function renderSlide() {
            const v = verses[currentIdx];
            document.getElementById('present-text-en').innerText = v.text_en;
            document.getElementById('present-text-ta').innerText = v.text_ta;
            document.getElementById('verse-badge').innerText = `${bookNameEn} ${chapter}:${v.verse}`;
            document.getElementById('slide-indicator').innerText = `Verse ${v.verse} / ${verses.length}`;
        }

        function nextSlide() {
            if (currentIdx < verses.length - 1) {
                currentIdx++;
                renderSlide();
            }
        }

        function prevSlide() {
            if (currentIdx > 0) {
                currentIdx--;
                renderSlide();
            }
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen();
            }
        }

        // Keyboard Presentation Controls
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
                nextSlide();
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                prevSlide();
            } else if (e.key === 'f' || e.key === 'F') {
                toggleFullscreen();
            } else if (e.key === 'b' || e.key === 'B') {
                document.body.classList.toggle('screen-black');
            } else if (e.key === 'w' || e.key === 'W') {
                document.body.classList.toggle('screen-white');
            } else if (e.key === 'Escape') {
                document.body.classList.remove('screen-black', 'screen-white');
            }
        });
    </script>
</body>
</html>
