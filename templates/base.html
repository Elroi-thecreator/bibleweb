<!DOCTYPE html>
<html lang="ta" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}வேதம் | Holy Bible{% endblock %}</title>

    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#b45309">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Holy Bible">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    screens: {
                        'xs': '420px',
                    },
                    fontFamily: {
                        serif: ['Lora', 'serif'],
                        cinzel: ['Cinzel', 'serif'],
                        tamil: ['"Noto Serif Tamil"', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .font-tamil { font-family: 'Noto Serif Tamil', serif; line-height: 2.1; }
        .font-english { font-family: 'Lora', serif; line-height: 1.85; }
        body.theme-sepia { background-color: #FAF6EE; color: #2D241E; }
        body.theme-sepia .bg-card { background-color: #F3EBDD; border-color: #E2D3BF; }
    </style>
</head>
<body class="bg-stone-50 text-stone-900 dark:bg-stone-950 dark:text-stone-100 transition-colors duration-200 min-h-screen flex flex-col font-serif">

    <!-- Navbar -->
    <header id="site-header" class="sticky top-0 z-40 bg-white/95 dark:bg-stone-900/95 backdrop-blur-md border-b border-stone-200 dark:border-stone-800 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-3 sm:px-6 h-14 sm:h-16 flex items-center justify-between gap-2">
            
            <!-- Brand Link -->
            <a href="/" class="flex items-center space-x-2 shrink-0">
                <span class="w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-amber-700 text-white flex items-center justify-center font-cinzel font-bold text-xs sm:text-sm shadow-xs">†</span>
                <div>
                    <span class="font-cinzel tracking-wider text-sm sm:text-base font-bold block leading-none">THE BIBLE</span>
                    <span class="font-tamil text-[10px] sm:text-xs text-amber-800 dark:text-amber-400 leading-none">வேதாகமம்</span>
                </div>
            </a>

            <!-- Search Bar (Desktop) -->
            <form action="/search" method="get" class="hidden md:flex flex-1 max-w-xs mx-3">
                <div class="relative w-full">
                    <input type="text" name="q" placeholder="Search / தேடுக..."
                           class="w-full text-xs bg-stone-100 dark:bg-stone-800 border border-stone-300 dark:border-stone-700 rounded-full pl-8 pr-3 py-1.5 focus:outline-none focus:ring-1 focus:ring-amber-700">
                    <span class="absolute left-2.5 top-2 text-stone-400 text-xs">🔍</span>
                </div>
            </form>

            <!-- Navigation Links, Sync & Theme Settings -->
            <div class="flex items-center space-x-1 sm:space-x-1.5 text-xs shrink-0">
                <a href="/plans" class="p-1.5 sm:px-2.5 sm:py-1.5 rounded-lg hover:bg-stone-100 dark:hover:bg-stone-800 text-stone-600 dark:text-stone-300 flex items-center gap-1 font-medium" title="Reading Plans">
                    <span>📅</span> <span class="hidden md:inline">Plans</span>
                </a>

                <a href="/progress" class="p-1.5 sm:px-2.5 sm:py-1.5 rounded-lg hover:bg-stone-100 dark:hover:bg-stone-800 text-stone-600 dark:text-stone-300 flex items-center gap-1 font-medium" title="Reading Progress">
                    <span>📊</span> <span class="hidden md:inline">Progress</span>
                </a>

                <a href="/bookmarks" class="p-1.5 sm:px-2.5 sm:py-1.5 rounded-lg hover:bg-stone-100 dark:hover:bg-stone-800 text-stone-600 dark:text-stone-300 flex items-center gap-1 font-medium" title="Saved Verses">
                    <span>★</span> <span class="hidden md:inline">Saved</span>
                </a>

                <!-- Supabase Cloud Sync / Sign In -->
                <div id="auth-sync-container" class="flex items-center">
                    <button id="auth-btn" onclick="handleAuthButtonClick()" 
                            class="px-2 sm:px-2.5 py-1 rounded-xl border border-stone-300 dark:border-stone-700 hover:border-amber-600 text-[11px] sm:text-xs font-semibold text-stone-700 dark:text-stone-300 flex items-center gap-1 transition cursor-pointer">
                        <span id="auth-icon" class="text-xs">☁️</span> <span id="auth-btn-label" class="max-w-[70px] truncate inline-block">Sign In</span>
                    </button>
                </div>

                <!-- Theme Pickers (Compact) -->
                <div class="flex items-center border border-stone-300 dark:border-stone-700 rounded-full p-0.5 bg-stone-100 dark:bg-stone-800">
                    <button onclick="setTheme('light')" class="px-1.5 py-0.5 rounded-full text-[11px] hover:bg-white dark:hover:bg-stone-700" title="Light">☀️</button>
                    <button onclick="setTheme('sepia')" class="px-1.5 py-0.5 rounded-full text-[11px] hover:bg-amber-100 dark:hover:bg-amber-900" title="Sepia">📜</button>
                    <button onclick="setTheme('dark')" class="px-1.5 py-0.5 rounded-full text-[11px] hover:bg-stone-600" title="Dark">🌙</button>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1">
        {% block content %}{% endblock %}
    </main>

    <footer class="border-t border-stone-200 dark:border-stone-800 py-6 bg-stone-100 dark:bg-stone-950 text-center text-[11px] text-stone-500">
        <p class="font-cinzel tracking-widest text-stone-700 dark:text-stone-400">SOLI DEO GLORIA</p>
        <p class="mt-0.5 font-tamil">பரிசுத்த வேதாகமம் • Bilingual Scripture</p>
    </footer>

    <!-- Auth Modals -->
    <div id="auth-modal" class="hidden fixed inset-0 bg-stone-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-3">
        <div class="bg-white dark:bg-stone-900 rounded-2xl shadow-2xl max-w-sm w-full p-5 border border-stone-200 dark:border-stone-800 text-center">
            <div class="w-10 h-10 bg-amber-100 dark:bg-amber-950/50 text-amber-700 rounded-full flex items-center justify-center mx-auto mb-2 text-lg">†</div>
            <h3 class="font-cinzel font-bold text-base text-stone-900 dark:text-stone-100 mb-1">Save Progress</h3>
            <p class="text-[11px] text-stone-500 mb-3">Sync your bookmarks, read chapters, and highlights across all devices automatically.</p>

            <form id="magic-link-form" onsubmit="handleSendMagicLink(event)" class="space-y-2.5 text-left">
                <input type="email" id="auth-email-input" required placeholder="name@example.com"
                       class="w-full px-3 py-2 text-xs rounded-xl border border-stone-300 dark:border-stone-700 bg-stone-50 dark:bg-stone-800 text-stone-900 dark:text-stone-100 focus:outline-none focus:ring-2 focus:ring-amber-700">
                <button type="submit" id="magic-link-btn" 
                        class="w-full py-2 bg-amber-700 hover:bg-amber-800 text-white rounded-xl text-xs font-bold transition cursor-pointer">
                    Send Link →
                </button>
            </form>

            <button onclick="document.getElementById('auth-modal').classList.add('hidden')" class="mt-3 text-[11px] text-stone-400 hover:text-stone-600 cursor-pointer">
                Cancel
            </button>
        </div>
    </div>

    <div id="account-modal" class="hidden fixed inset-0 bg-stone-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-3">
        <div class="bg-white dark:bg-stone-900 rounded-2xl shadow-2xl max-w-sm w-full p-5 border border-stone-200 dark:border-stone-800 text-center space-y-3">
            <h3 class="font-cinzel font-bold text-sm text-stone-900 dark:text-stone-100">Account Synced</h3>
            <p id="account-email-display" class="text-xs font-mono text-emerald-600 bg-emerald-50 dark:bg-emerald-950/30 py-1.5 px-2 rounded-lg break-all"></p>
            
            <div class="flex gap-2">
                <button onclick="syncWithSupabase(); document.getElementById('account-modal').classList.add('hidden');" 
                        class="flex-1 py-1.5 bg-stone-100 dark:bg-stone-800 rounded-xl text-xs font-semibold hover:border-amber-600 border border-stone-300 dark:border-stone-700 cursor-pointer">
                    Sync 🔄
                </button>
                <button onclick="handleSignOut()" 
                        class="flex-1 py-1.5 bg-rose-50 text-rose-700 dark:bg-rose-950/40 dark:text-rose-300 rounded-xl text-xs font-semibold hover:bg-rose-100 cursor-pointer">
                    Sign Out
                </button>
            </div>
            <button onclick="document.getElementById('account-modal').classList.add('hidden')" class="text-xs text-stone-400 hover:underline cursor-pointer block w-full text-center">Close</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        window.SUPABASE_URL = "https://pyuwejlodeyrvufrxtrf.supabase.co";
        window.SUPABASE_ANON_KEY = "PASTE_YOUR_SUPABASE_ANON_KEY_HERE";
        if (window.supabase && window.SUPABASE_ANON_KEY && !window.SUPABASE_ANON_KEY.includes("PASTE_YOUR")) {
            window.sbClient = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
        }
    </script>

    <script src="/static/js/storage.js?v=5.2"></script>
    <script>
        function setTheme(theme) {
            document.documentElement.classList.remove('dark');
            document.body.classList.remove('theme-sepia');
            if (theme === 'dark') {
                document.documentElement.classList.add('dark');
            } else if (theme === 'sepia') {
                document.body.classList.add('theme-sepia');
            }
            localStorage.setItem('bible_app_theme', theme);
        }
        (function() {
            const saved = localStorage.getItem('bible_app_theme') || 'light';
            setTheme(saved);
        })();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(err => {
                    console.warn('PWA registration failed:', err);
                });
            });
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
