<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Bilingual Bible (Tamil - English){% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tamil and English Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Mukta+Malar:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .tamil-text { font-family: 'Mukta Malar', sans-serif; line-height: 1.85; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col">
    <!-- Navbar -->
    <header class="bg-white border-b sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-2">
            <div class="flex items-center space-x-3">
                <a href="/" class="text-xl font-bold text-blue-700 tracking-tight">வேதம் | Bible</a>
                <button onclick="document.getElementById('nav-modal').classList.toggle('hidden')" 
                        class="text-sm bg-gray-100 hover:bg-gray-200 px-3 py-1.5 rounded-md font-medium text-gray-700">
                    📖 Select Book
                </button>
            </div>

            <!-- Search Bar -->
            <form action="/search" method="get" class="flex-1 max-w-md mx-2">
                <input type="text" name="q" placeholder="Search / தேடுக (e.g. John 3:16, அன்பு)..."
                       class="w-full bg-gray-100 border border-gray-300 rounded-full px-4 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </form>

            <div class="flex items-center space-x-2">
                <a href="/bookmarks" class="text-sm px-3 py-1.5 rounded-md text-gray-600 hover:bg-gray-100">
                    ★ Saved
                </a>
            </div>
        </div>
    </header>

    <!-- Quick Navigation Modal -->
    <div id="nav-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-xl max-w-2xl w-full p-6 max-h-[80vh] flex flex-col">
            <div class="flex justify-between items-center mb-4 pb-2 border-b">
                <h3 class="font-semibold text-lg">Select a Book (புத்தகத்தைத் தேர்ந்தெடுக்கவும்)</h3>
                <button onclick="document.getElementById('nav-modal').classList.add('hidden')" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
            </div>
            <div class="overflow-y-auto grid grid-cols-2 sm:grid-cols-3 gap-2 text-sm pr-1">
                {% for b in books %}
                <a href="/book/{{ b[0] }}/chapter/1" 
                   class="p-2 rounded hover:bg-blue-50 hover:text-blue-700 border border-gray-100 flex flex-col">
                    <span class="font-medium text-gray-900">{{ b[1] }}</span>
                    <span class="tamil-text text-xs text-gray-500">{{ b[2] }}</span>
                </a>
                {% endfor %}
            </div>
        </div>
    </div>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-white border-t py-4 text-center text-xs text-gray-500">
        Bilingual Bible Reader • Client-side bookmarks & settings saved in browser
    </footer>

    <script src="/static/js/storage.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
