<!-- Inside templates/base.html -> in <head>: -->
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#b45309">

<!-- Inside templates/base.html -> under Header Navigation Links: -->
<div class="flex items-center space-x-2 text-xs">
    <a href="/plans" class="px-2.5 py-1.5 rounded-lg hover:bg-stone-100 dark:hover:bg-stone-800 text-stone-600 dark:text-stone-300 flex items-center gap-1 font-medium" title="Reading Plans">
        <span>📅</span> <span class="hidden sm:inline">Plans</span>
    </a>
    <a href="/progress" class="px-2.5 py-1.5 rounded-lg hover:bg-stone-100 dark:hover:bg-stone-800 text-stone-600 dark:text-stone-300 flex items-center gap-1 font-medium" title="Reading Progress">
        <span>📊</span> <span class="hidden sm:inline">Progress</span>
    </a>
    <a href="/bookmarks" class="px-2.5 py-1.5 rounded-lg hover:bg-stone-100 dark:hover:bg-stone-800 text-stone-600 dark:text-stone-300 flex items-center gap-1 font-medium">
        <span>★</span> <span class="hidden sm:inline">Bookmarks</span>
    </a>
</div>

<!-- Inside templates/base.html -> at the bottom of <body>: -->
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').catch(err => {
                console.warn('PWA registration failed:', err);
            });
        });
    }
</script>
