{% extends "base.html" %}

{% block title %}{{ book_name }} {{ chapter_num }} - BibleWeb{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 py-6">
    <!-- Chapter Header & Navigation -->
    <div class="flex items-center justify-between border-b pb-4 mb-6">
        <div>
            <h1 class="text-3xl font-serif font-bold text-gray-900">{{ book_name }} {{ chapter_num }}</h1>
        </div>
        <div class="flex items-center gap-2">
            {% if chapter_num > 1 %}
            <a href="/read?book={{ book_name }}&chapter={{ chapter_num - 1 }}" 
               class="px-3 py-1.5 border rounded text-sm hover:bg-gray-50 text-gray-700">Previous</a>
            {% endif %}
            <a href="/read?book={{ book_name }}&chapter={{ chapter_num + 1 }}" 
               class="px-3 py-1.5 border rounded text-sm hover:bg-gray-50 text-gray-700">Next</a>
        </div>
    </div>

    <!-- Verses Container -->
    <div id="chapter-verses" class="space-y-3 font-serif text-lg leading-relaxed text-gray-800 select-text">
        {% for v in verses %}
        <p class="verse-item p-1.5 rounded transition-colors duration-150 cursor-pointer hover:bg-gray-50" 
           data-verse="{{ v.verse }}"
           id="v-{{ v.verse }}">
            <sup class="text-xs text-indigo-600 font-sans font-semibold mr-1 select-none">{{ v.verse }}</sup>
            <span class="verse-text">{{ v.text }}</span>
        </p>
        {% endfor %}
    </div>
</div>

<!-- Floating Action Popover -->
<div id="verse-action-popover" 
     class="hidden fixed z-50 bg-white shadow-xl border border-gray-200 rounded-lg p-1.5 flex items-center gap-1.5">
    <button id="btn-popover-bookmark" 
            class="px-2.5 py-1 text-xs font-sans font-medium rounded hover:bg-indigo-50 text-indigo-700 transition">
        🔖 Bookmark
    </button>
    <button id="btn-popover-highlight" 
            class="px-2.5 py-1 text-xs font-sans font-medium rounded hover:bg-yellow-50 text-yellow-800 transition">
        🖍️ Highlight
    </button>
</div>

<script src="/static/js/storage.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
    const popover = document.getElementById("verse-action-popover");
    const btnBookmark = document.getElementById("btn-popover-bookmark");
    const btnHighlight = document.getElementById("btn-popover-highlight");

    const currentBook = "{{ book_name }}";
    const currentChapter = parseInt("{{ chapter_num }}", 10);
    const highlights = StorageManager.getHighlights();

    let selectedVerse = null;

    // Initialize verses state
    document.querySelectorAll(".verse-item").forEach(el => {
        const vNum = parseInt(el.dataset.verse, 10);
        const vKey = `${currentBook}_${currentChapter}_${vNum}`;

        if (highlights[vKey]) {
            el.classList.add(highlights[vKey]);
        }
        if (StorageManager.isBookmarked(currentBook, currentChapter, vNum)) {
            el.classList.add("border-l-4", "border-indigo-500", "pl-2");
        }

        el.addEventListener("click", (e) => {
            selectedVerse = {
                book: currentBook,
                chapter: currentChapter,
                verse: vNum,
                text: el.querySelector(".verse-text").innerText.trim(),
                key: vKey,
                element: el
            };

            const rect = el.getBoundingClientRect();
            popover.style.top = `${window.scrollY + rect.top - 42}px`;
            popover.style.left = `${window.scrollX + Math.max(10, rect.left)}px`;
            popover.classList.remove("hidden");

            const isSaved = StorageManager.isBookmarked(currentBook, currentChapter, vNum);
            btnBookmark.innerText = isSaved ? "Remove Bookmark" : "🔖 Bookmark";
        });
    });

    btnBookmark.addEventListener("click", (e) => {
        e.stopPropagation();
        if (!selectedVerse) return;
        const added = StorageManager.saveBookmark({
            book: selectedVerse.book,
            chapter: selectedVerse.chapter,
            verse: selectedVerse.verse,
            text: selectedVerse.text
        });

        selectedVerse.element.classList.toggle("border-l-4", added);
        selectedVerse.element.classList.toggle("border-indigo-500", added);
        selectedVerse.element.classList.toggle("pl-2", added);
        popover.classList.add("hidden");
    });

    btnHighlight.addEventListener("click", (e) => {
        e.stopPropagation();
        if (!selectedVerse) return;
        const colorClass = "bg-yellow-100";
        const hasHighlight = StorageManager.toggleHighlight(selectedVerse.key, colorClass);

        if (hasHighlight) {
            selectedVerse.element.classList.add(colorClass);
        } else {
            selectedVerse.element.classList.remove(colorClass);
        }
        popover.classList.add("hidden");
    });

    // Close on outside click
    document.addEventListener("click", (e) => {
        if (!popover.contains(e.target) && !e.target.closest(".verse-item")) {
            popover.classList.add("hidden");
        }
    });
});
</script>
{% endblock %}
