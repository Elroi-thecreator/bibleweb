{% extends "base.html" %}

{% block title %}Reading Plans - BibleWeb{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 py-8">
    <div class="mb-6">
        <h1 class="text-3xl font-bold text-gray-900">Reading Plans</h1>
        <p class="text-gray-600 mt-1">Structured 100-day guided tracks for regular scripture study.</p>
    </div>

    <!-- Plan Selector -->
    <div class="flex gap-3 mb-6">
        <button onclick="switchPlan('100_whole_bible')" id="btn-100_whole_bible"
                class="plan-tab px-4 py-2 text-sm font-medium rounded-lg border bg-indigo-600 text-white">
            Whole Bible (100 Days)
        </button>
        <button onclick="switchPlan('100_new_testament')" id="btn-100_new_testament"
                class="plan-tab px-4 py-2 text-sm font-medium rounded-lg border bg-white text-gray-700 hover:bg-gray-50">
            New Testament (100 Days)
        </button>
    </div>

    <!-- Progress Summary Bar -->
    <div class="bg-white p-4 border rounded-xl shadow-sm mb-6">
        <div class="flex justify-between items-center text-sm font-medium text-gray-700 mb-2">
            <span>Progress</span>
            <span id="plan-progress-text">0% Completed</span>
        </div>
        <div class="w-full bg-gray-200 h-3 rounded-full overflow-hidden">
            <div id="plan-progress-bar" class="bg-indigo-600 h-3 rounded-full transition-all duration-300" style="width: 0%;"></div>
        </div>
    </div>

    <!-- Days List -->
    <div id="plan-days-container" class="space-y-2">
        <div class="text-center py-8 text-gray-400">Loading plan schedule...</div>
    </div>
</div>

<script src="/static/js/storage.js"></script>
<script>
let currentPlanId = '100_whole_bible';

async function switchPlan(planId) {
    currentPlanId = planId;
    document.querySelectorAll('.plan-tab').forEach(btn => {
        btn.className = 'plan-tab px-4 py-2 text-sm font-medium rounded-lg border bg-white text-gray-700 hover:bg-gray-50';
    });
    const activeBtn = document.getElementById(`btn-${planId}`);
    if (activeBtn) {
        activeBtn.className = 'plan-tab px-4 py-2 text-sm font-medium rounded-lg border bg-indigo-600 text-white';
    }
    await loadPlan(planId);
}

async function loadPlan(planId) {
    const container = document.getElementById("plan-days-container");
    container.innerHTML = `<div class="text-center py-8 text-gray-400">Loading schedule...</div>`;

    try {
        const res = await fetch(`/api/plans/${planId}`);
        if (!res.ok) throw new Error("Could not retrieve plan");
        const data = await res.json();
        renderDays(data.days || [], planId);
    } catch (err) {
        container.innerHTML = `<div class="text-red-500 py-4">Error loading reading plan schedule.</div>`;
    }
}

function renderDays(days, planId) {
    const container = document.getElementById("plan-days-container");
    container.innerHTML = "";

    const progress = StorageManager.getPlanProgress(planId);

    days.forEach(item => {
        const isDone = !!progress[item.day];
        const row = document.createElement("div");
        row.className = `p-3.5 border rounded-lg flex items-center justify-between transition ${
            isDone ? 'bg-green-50 border-green-200' : 'bg-white border-gray-200'
        }`;

        row.innerHTML = `
            <div class="flex items-center gap-3">
                <span class="w-12 text-sm font-bold text-gray-600">Day ${item.day}</span>
                <span class="text-gray-900 font-medium">${item.passage || item.reading}</span>
            </div>
            <label class="flex items-center gap-2 cursor-pointer text-sm select-none">
                <input type="checkbox" data-day="${item.day}" ${isDone ? 'checked' : ''} 
                       class="h-4 w-4 text-indigo-600 rounded border-gray-300 focus:ring-indigo-500">
                <span class="text-xs text-gray-500">${isDone ? 'Done' : 'Mark Done'}</span>
            </label>
        `;

        row.querySelector("input").addEventListener("change", (e) => {
            const checked = e.target.checked;
            StorageManager.setDayProgress(planId, item.day, checked);
            row.classList.toggle("bg-green-50", checked);
            row.classList.toggle("border-green-200", checked);
            row.querySelector("span.text-xs").innerText = checked ? 'Done' : 'Mark Done';
            calculateProgress(days.length, StorageManager.getPlanProgress(planId));
        });

        container.appendChild(row);
    });

    calculateProgress(days.length, progress);
}

function calculateProgress(total, progressObj) {
    const completed = Object.values(progressObj).filter(Boolean).length;
    const pct = total > 0 ? Math.round((completed / total) * 100) : 0;
    document.getElementById("plan-progress-bar").style.width = `${pct}%`;
    document.getElementById("plan-progress-text").innerText = `${pct}% (${completed}/${total} Days)`;
}

document.addEventListener("DOMContentLoaded", () => {
    loadPlan(currentPlanId);
});
</script>
{% endblock %}
