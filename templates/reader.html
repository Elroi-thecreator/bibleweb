{% block scripts %}
<script src="/static/js/audio_player.js"></script>
<script>
    window.CURRENT_BOOK_ID = {{ book.id }};
    window.CURRENT_CHAPTER = {{ chapter }};

    document.addEventListener('DOMContentLoaded', () => {
        // Initialize UI state immediately
        if (typeof updateChapterReadUI === 'function') {
            updateChapterReadUI(window.CURRENT_BOOK_ID, window.CURRENT_CHAPTER);
        }

        // Initialize continuous audio engine
        if (window.bibleAudio) {
            window.bibleAudio.init({{ book.id }}, {{ chapter }}, {{ next_ch or 'null' }}, '{{ mode }}');
        }
    });

    function toggleViewMenu() {
        const menu = document.getElementById('view-menu-dropdown');
        if (menu) menu.classList.toggle('hidden');
    }

    document.addEventListener('click', (e) => {
        const btn = document.getElementById('view-menu-btn');
        const menu = document.getElementById('view-menu-dropdown');
        if (btn && menu && !btn.contains(e.target) && !menu.contains(e.target)) {
            menu.classList.add('hidden');
        }
    });

    function changeFontSize(delta) {
        document.querySelectorAll('.verse-text-en, .verse-text-ta').forEach(el => {
            const currentSize = parseFloat(window.getComputedStyle(el).fontSize);
            el.style.fontSize = (currentSize + delta) + 'px';
        });
    }

    function toggleZenMode() {
        const header = document.getElementById('site-header');
        const toolbar = document.getElementById('reader-toolbar');
        if (header) header.classList.toggle('hidden');
        if (toolbar) toolbar.classList.toggle('top-2');
        showToast("Focus mode toggled");
    }
</script>
{% endblock %}
