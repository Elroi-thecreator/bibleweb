name: Keep-Alive Ping

on:
  schedule:
    # Runs every 12 minutes (:00, :12, :24, :36, :48)
    - cron: '*/12 * * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub UI for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP GET Request
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://wa-akg-gateway-ub6a.onrender.com/api/sessions")
          echo "Endpoint responded with HTTP status: $STATUS"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 400 ]; then
            echo "Warning: Received non-2xx status code."
          fi
