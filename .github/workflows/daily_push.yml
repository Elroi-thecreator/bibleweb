name: Dispatch Daily Bible Reminders

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  send-push:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install web-push @supabase/supabase-js

      - name: Query and Dispatch Notifications
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          node -e '
          const webpush = require("web-push");
          const { createClient } = require("@supabase/supabase-js");

          // Sanitize environment variables by removing accidental quotes, newlines, and trailing spaces
          const clean = (val) => (val || "").replace(/[\r\n\t "]/g, "").trim();

          const rawUrl = clean(process.env.SUPABASE_URL);
          const supabaseUrl = rawUrl.startsWith("http") ? rawUrl : "https://pyuwejlodeyrvufrxtrf.supabase.co";
          const serviceRoleKey = clean(process.env.SUPABASE_SERVICE_ROLE_KEY);
          const vapidPublic = clean(process.env.VAPID_PUBLIC_KEY);
          const vapidPrivate = clean(process.env.VAPID_PRIVATE_KEY);

          if (!serviceRoleKey) {
            console.error("Missing or empty SUPABASE_SERVICE_ROLE_KEY secret!");
            process.exit(1);
          }
          if (!vapidPublic || !vapidPrivate) {
            console.error("Missing or empty VAPID keys!");
            process.exit(1);
          }

          webpush.setVapidDetails(
            "mailto:admin@elroi-bible.app",
            vapidPublic,
            vapidPrivate
          );

          // Custom fetch wrapper with detailed network logging
          const customFetch = async (url, options) => {
            try {
              return await fetch(url, options);
            } catch (err) {
              console.error("Network fetch failed to URL:", url);
              if (err.cause) console.error("Underlying cause:", err.cause);
              throw err;
            }
          };

          const supabase = createClient(supabaseUrl, serviceRoleKey, {
            auth: { persistSession: false, autoRefreshToken: false },
            global: { fetch: customFetch }
          });

          async function main() {
            console.log("Connecting to Supabase project:", supabaseUrl);
            const { data: subs, error } = await supabase
              .from("user_push_subscriptions")
              .select("*");

            if (error) {
              console.error("Database query failed:", error);
              process.exit(1);
            }

            console.log(`Found ${subs.length} active subscription(s).`);

            if (subs.length === 0) {
              console.log("No subscriptions found in table user_push_subscriptions.");
              return;
            }

            const payload = JSON.stringify({
              title: "Daily Scripture Reading 📖",
              body: "Take a moment to read your assigned chapter today!",
              url: "/plans"
            });

            for (const sub of subs) {
              const pushConfig = {
                endpoint: sub.endpoint,
                keys: {
                  p256dh: sub.p256dh,
                  auth: sub.auth
                }
              };

              try {
                await webpush.sendNotification(pushConfig, payload);
                console.log("Delivered push to:", sub.endpoint.slice(0, 35));
              } catch (err) {
                console.warn("Delivery issue:", err.statusCode, err.message);
                if (err.statusCode === 410 || err.statusCode === 404) {
                  await supabase.from("user_push_subscriptions").delete().eq("id", sub.id);
                  console.log("Purged expired subscription:", sub.id);
                }
              }
            }
          }

          main().catch(err => {
            console.error("Top-level execution error:", err);
            process.exit(1);
          });
          '
