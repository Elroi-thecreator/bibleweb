name: Dispatch Daily Bible Reminders

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  send-push:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install web-push @supabase/supabase-js

      - name: Query and Dispatch Notifications
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          node -e '
          const webpush = require("web-push");
          const { createClient } = require("@supabase/supabase-js");

          // Safely fallback if the SUPABASE_URL secret is omitted
          const rawUrl = process.env.SUPABASE_URL;
          const supabaseUrl = (rawUrl && rawUrl.trim().length > 0)
            ? rawUrl.trim()
            : "https://pyuwejlodeyrvufrxtrf.supabase.co";

          const serviceRoleKey = process.env.SUPABASE_SERVICE_ROLE_KEY;
          const vapidPublic = process.env.VAPID_PUBLIC_KEY;
          const vapidPrivate = process.env.VAPID_PRIVATE_KEY;

          if (!serviceRoleKey) {
            console.error("Missing SUPABASE_SERVICE_ROLE_KEY secret!");
            process.exit(1);
          }
          if (!vapidPublic || !vapidPrivate) {
            console.error("Missing VAPID keys!");
            process.exit(1);
          }

          webpush.setVapidDetails(
            "mailto:admin@elroi-bible.app",
            vapidPublic,
            vapidPrivate
          );

          const supabase = createClient(supabaseUrl, serviceRoleKey);

          async function main() {
            const { data: subs, error } = await supabase
              .from("user_push_subscriptions")
              .select("*");

            if (error) {
              console.error("Database query failed:", error.message);
              process.exit(1);
            }

            console.log(`Found ${subs.length} active subscription(s).`);

            const payload = JSON.stringify({
              title: "Daily Scripture Reading 📖",
              body: "Take a moment to read your assigned chapter today!",
              url: "/plans"
            });

            for (const sub of subs) {
              const pushConfig = {
                endpoint: sub.endpoint,
                keys: {
                  p256dh: sub.p256dh,
                  auth: sub.auth
                }
              };

              try {
                await webpush.sendNotification(pushConfig, payload);
                console.log("Delivered push to:", sub.endpoint.slice(0, 35));
              } catch (err) {
                console.warn("Delivery issue:", err.statusCode, err.message);
                if (err.statusCode === 410 || err.statusCode === 404) {
                  await supabase.from("user_push_subscriptions").delete().eq("id", sub.id);
                  console.log("Purged expired subscription:", sub.id);
                }
              }
            }
          }

          main();
          '
